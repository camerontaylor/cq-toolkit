# instantiated from policy/templates/required-check.md (the I4 trigger
# shape; the steps are the denylist scan itself) — edit the template, not
# this file
name: denylist

# Invariant I4: this workflow must never filter its triggers — no `paths`, no
# `paths-ignore`, no branch or tag filters of any kind. The denylist scan runs
# on every push and every pull_request, without exception — the one job-level
# skip below (the `cq-state` settle-ledger branch, review-debt #226) keeps the
# trigger surface unfiltered; a machine-written ledger push is not a tree the
# scan needs to judge.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  denylist:
    runs-on: ubuntu-latest
    # The `cq-state` settle ledger is machine-written; its pushes are not
    # reviewable changes (review-debt #226). Job-level, never a trigger
    # filter — I4 keeps the trigger surface intact.
    if: ${{ github.ref != 'refs/heads/cq-state' }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (immutable commit pin; repo policy)
        with:
          # The scan runs repo code, so the checkout token must not
          # survive checkout (persist-credentials: false).
          persist-credentials: false
      - name: Install pinned gitleaks v8.30.1 (digest-pinned)
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP:-/tmp}"
          tarball="gitleaks_8.30.1_linux_x64.tar.gz"
          # sha256 of the v8.30.1 linux_x64 release tarball, pinned here so a
          # replaced release asset cannot substitute a different binary; the
          # version is pinned the same way.
          digest="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSL -o "${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/${tarball}"
          echo "${digest}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Denylist tree scan
        run: ./scripts/denylist-scan
      - name: Denylist self-test
        run: ./scripts/denylist-scan --self-test
