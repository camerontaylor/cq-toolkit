name: denylist

# Invariant I4: this workflow must never filter its triggers — no `paths`, no
# `paths-ignore`, no branch or tag filters of any kind. The denylist scan runs
# on every push and every pull_request, without exception.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  denylist:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
      - name: Install pinned gitleaks v8.30.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Denylist tree scan
        run: ./scripts/denylist-scan
      - name: Denylist self-test
        run: ./scripts/denylist-scan --self-test
