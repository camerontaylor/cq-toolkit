# instantiated from policy/templates/cq-measure.yml — edit the template, not this file
# Advisory PR diagnostics for direct main development. No queue promotion carrier.
name: cq-measure

on:
  pull_request:

permissions: {}

# Supersede older diagnostics for the same event and ref.
concurrency:
  group: cq-measure-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# pnpm-workspace.yaml's global virtual store is a local-worktree speedup
# only: CI installs a conventional per-project node_modules, so no step
# inherits pnpm's NODE_PATH/NODE_OPTIONS resolve hook for shared stores.
env:
  PNPM_CONFIG_VIRTUAL_STORE_TYPE: project

jobs:
  fetch:
    name: fetch subject objects
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the subject without running it
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (immutable commit pin; repo policy)
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bundle the subject's git objects
        run: |
          set -euo pipefail
          git update-ref refs/cq-transfer/subject HEAD
          mkdir -p "${RUNNER_TEMP}/cq-source"
          git bundle create "${RUNNER_TEMP}/cq-source/source.bundle" refs/cq-transfer/subject
      - name: Upload the source bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (immutable commit pin; repo policy)
        with:
          name: cq-measure-source
          path: ${{ runner.temp }}/cq-source/source.bundle
          if-no-files-found: error
          retention-days: 1

  measure:
    name: measure
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download the subject's git objects
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (immutable commit pin; repo policy)
        with:
          name: cq-measure-source
          path: ${{ runner.temp }}/cq-source
      - name: Check out the subject from the bundle (no credential)
        env:
          SUBJECT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git fetch --no-tags "${RUNNER_TEMP}/cq-source/source.bundle" refs/cq-transfer/subject
          git checkout --detach "$SUBJECT"
      - name: Install ripgrep for harness search tools
        uses: ./.github/actions/install-ripgrep
      - name: Set up pnpm (version from package.json packageManager)
        # v6.1.0, immutable commit pin (repo policy)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Set up Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (immutable commit pin; repo policy)
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run the suite with coverage
        run: |
          # A stale summary is removed FIRST so a crashed suite can never
          # leave older numbers behind as this run's evidence.
          rm -f coverage/coverage-summary.json
          pnpm exec vitest run --coverage
      - name: Write the numbers-only measurement
        run: |
          # The artifact carries numbers and nothing else; the verifier
          # rejects any other shape. Rounding to one decimal is the
          # verifier's job, never this leg's.
          mkdir -p "${RUNNER_TEMP}/cq-measure"
          jq -e '{schemaVersion: 1, metrics: {coverage: .total.lines.pct}}
                 | select(.metrics.coverage | type == "number")' \
            coverage/coverage-summary.json > "${RUNNER_TEMP}/cq-measure/measurement.json"
          cat "${RUNNER_TEMP}/cq-measure/measurement.json"
      - name: Upload the measurement artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (immutable commit pin; repo policy)
        with:
          name: cq-measure
          path: ${{ runner.temp }}/cq-measure/measurement.json
          if-no-files-found: error
          retention-days: 7
