# instantiated from policy/templates/cq-measure.yml — edit the template, not this file
# cq-measure — the HEAD-DEFINED measurement leg of the ratchet (ADR-0004
# D-A.4, D-B "Ratchet: coverage (head-executed)"; W1.7).
#
# This workflow runs the HEAD's definition over the HEAD's code: a pull
# request can edit this file, its tests, and its coverage config. So it
# decides nothing. It is a wake-up and an UNTRUSTED producer:
#   - `permissions: {}` and no `secrets.*`, no `environment:` — the job holds
#     no credential a head test could read (ADR-0004 D-D.5);
#   - the only output is a numbers-only artifact (`cq-measure`), which the
#     default-branch verifier (`cq-verify.yml`, `workflow_run`) downloads as
#     DATA, validates against a strict schema, and judges against the trust
#     ref's baselines. A head that edits this file or any measurement config
#     is caught by the verifier's definition check (needs-human, D11).
#   - Accepted residual (ADR-0004 D-J, owner-accepted at G1): the head
#     executes here, so it can make this leg report ANY coverage value.
#
# The subject is the PR HEAD SHA (not the synthetic merge ref): the verdict
# binds to `workflow_run.head_sha`, so the measured tree must be that commit.
# On `push: merge-queue` the subject is the pushed tip.
#
# Not a required check (the verifier's App-created verdict is, from W1.10),
# so the push branch filter is allowed here; the pull_request trigger stays
# unfiltered so every PR is measured.
name: cq-measure

on:
  pull_request:
  push:
    branches:
      - merge-queue

permissions: {}

concurrency:
  group: cq-measure-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: measure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the subject commit (the PR head, or the pushed tip)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (immutable commit pin; repo policy)
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Head code runs below; nothing may survive checkout.
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (immutable commit pin; repo policy)
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run the suite with coverage
        run: |
          # A stale summary is removed FIRST so a crashed suite can never
          # leave older numbers behind as this run's evidence.
          rm -f coverage/coverage-summary.json
          npx vitest run --coverage
      - name: Write the numbers-only measurement
        run: |
          # The artifact carries numbers and nothing else; the verifier
          # rejects any other shape. Rounding to one decimal is the
          # verifier's job, never this leg's.
          mkdir -p "${RUNNER_TEMP}/cq-measure"
          jq -e '{schemaVersion: 1, metrics: {coverage: .total.lines.pct}}
                 | select(.metrics.coverage | type == "number")' \
            coverage/coverage-summary.json > "${RUNNER_TEMP}/cq-measure/measurement.json"
          cat "${RUNNER_TEMP}/cq-measure/measurement.json"
      - name: Upload the measurement artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (immutable commit pin; repo policy)
        with:
          name: cq-measure
          path: ${{ runner.temp }}/cq-measure/measurement.json
          if-no-files-found: error
          retention-days: 7
