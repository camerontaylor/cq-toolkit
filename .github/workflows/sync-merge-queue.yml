# instantiated from policy/templates/sync-merge-queue.yml — edit the template, not this file
name: sync-merge-queue

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Triage runs serialize so two concurrent syncs cannot race each other into
# a spurious conflict issue; a running sync is never cancelled mid-PATCH.
concurrency:
  group: merge-queue-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Triage main vs merge-queue (API only, zero clone)
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          compare_api="repos/${repo}/compare/main...merge-queue"
          compare_html="https://github.com/${repo}/compare/main...merge-queue"

          open_divergence_issue() {
            gh issue create \
              --repo "${repo}" \
              --title "merge-queue diverged from main — needs merge/conflict resolution" \
              --body "sync-merge-queue could not reconcile the branches automatically.

          Compare: ${compare_html}

          Merge main into merge-queue (merge commit, never squash) and
          resolve any conflicts; the gate will fast-forward main afterwards."
          }

          merge_main_into_merge_queue() {
            # I3: the only reconciliation is a merge commit of main into
            # merge-queue (merge method merge, base merge-queue, head main).
            # On conflict the merge API creates nothing and returns 409 —
            # surface it to a human instead of forcing anything.
            if gh api -X POST "repos/${repo}/merges" \
              -f base="merge-queue" \
              -f head="main" \
              -f merge_method="merge" \
              -f commit_message="Merge main into merge-queue (sync-merge-queue)"; then
              echo "merged main into merge-queue with a merge commit (I3)"
            else
              echo "merge API refused (conflict) — opening the divergence issue"
              open_divergence_issue
            fi
          }

          main_sha="$(gh api "repos/${repo}/git/ref/heads/main" --jq .object.sha)"
          queue_sha="$(gh api "repos/${repo}/git/ref/heads/merge-queue" --jq .object.sha)"
          status="$(gh api "${compare_api}" --jq .status)"
          echo "triage: status=${status} main=${main_sha} merge-queue=${queue_sha}"

          case "${status}" in
            identical)
              echo "main and merge-queue are identical — nothing to do"
              ;;
            behind)
              # merge-queue is behind main: fast-forward it to main's HEAD.
              # force=false is the server-side ff invariant: the refs API
              # rejects any non-ff update with 422, so this can only move
              # merge-queue FORWARD to exactly main.
              if gh api -X PATCH "repos/${repo}/git/refs/heads/merge-queue" \
                -f sha="${main_sha}" \
                -F force=false; then
                echo "fast-forwarded merge-queue to main ${main_sha} (force=false)"
              else
                echo "PATCH of refs/heads/merge-queue rejected (non-ff 422) — merge-queue moved concurrently; treating as diverged"
                merge_main_into_merge_queue
              fi
              ;;
            ahead)
              # merge-queue is ahead of main: promote by fast-forward. This
              # is the ff invariant again — if main diverged meanwhile the
              # server 422s the PATCH; alarm it, never force.
              if gh api -X PATCH "repos/${repo}/git/refs/heads/main" \
                -f sha="${queue_sha}" \
                -F force=false; then
                echo "fast-forwarded main to merge-queue ${queue_sha} (force=false; the server rejects any non-ff)"
              else
                echo "PATCH of refs/heads/main rejected (non-ff 422) — main moved concurrently; opening the divergence issue"
                open_divergence_issue
              fi
              ;;
            diverged)
              merge_main_into_merge_queue
              ;;
            *)
              echo "unexpected compare status '${status}' — refusing to act"
              exit 1
              ;;
          esac
