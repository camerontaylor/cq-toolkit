# instantiated from policy/templates/init-merge-queue.yml — edit the template, not this file
# Template: init-merge-queue — one-time (and forever-idempotent) bootstrap of
# the merge-queue branch at origin/main HEAD. See policy/templates/README.md
# for the token table and the entitlement facts behind the queue design.
#
# The job runs in environment `automation` (main-only branch policy, W1.10
# Decision 8), so a dispatch from any other ref fails at job admission,
# before the credential is exposed.
#
# CREDENTIAL IDENTITY — per-run mint, no fallback. The bootstrap push
# authenticates as the registered cq-automation App, minted PER RUN by the
# job from the `automation` environment secret CQ_AUTOMATION_APP_KEY (the App
# private key) plus the repository variable CQ_AUTOMATION_APP_CLIENT_ID (its
# client id), scoped to this repository only (Contents write: creating a
# branch is a write). This is the per-run-mint pattern of PR #307
# (policy/templates/adversarial-suite.yml), shipped for the review loop in
# PR #313; it replaces the interim PAT pair (`CQ_AUTOMATION_TOKEN`/
# `PROMOTE_TOKEN`) and its explicit opt-in variable outright. No PAT fallback
# exists: an empty client-id variable skips the mint, the checkout then falls
# back to this job's read-only GITHUB_TOKEN, and the bootstrap push below
# fails loudly (a red run, no branch created).
#
# Instantiate: the body carries NO token in double braces — the bootstrap
# credential carries no placeholder (the mint below names the App key and
# client id literally, so each adopter sets them under these names).
# Then drop the result into .github/workflows/ and run it once from the
# Actions tab.
# The first bootstrap can equally be a plain
#   git push origin origin/main:refs/heads/merge-queue
# by an admin — this workflow exists so the bootstrap is repeatable and
# auditable instead. Edit the template, not the instantiation.
name: init-merge-queue

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  init:
    # Dispatch is an allowed carrier only on the default ref (D-A.1): a
    # dispatch on any other ref would run that ref's copy of this file.
    if: >-
      github.ref ==
      format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: automation
    steps:
      # Per-run mint, no PAT fallback: the bootstrap push authenticates as the
      # cq-automation App's installation token, minted here from the
      # `automation` secret CQ_AUTOMATION_APP_KEY plus the
      # CQ_AUTOMATION_APP_CLIENT_ID repository variable. `owner` is the
      # repository owner; `repositories` is THIS repository only. Creating a
      # branch is a write. Deliberately NO workflows/checks/statuses write.
      # The mint step is variable-gated: an empty client-id variable skips it,
      # the checkout below then uses its read-only GITHUB_TOKEN, and the push
      # fails loudly.
      - name: Mint the cq-automation App token (per run)
        id: init-app
        if: vars.CQ_AUTOMATION_APP_CLIENT_ID != ''
        # v3.2.0, immutable commit pin (repo policy)
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          client-id: ${{ vars.CQ_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.CQ_AUTOMATION_APP_KEY }}
          permission-contents: write
      # The checkout remote carries the minted automation credential, so the
      # branch-creating push below authenticates with it (a write needs more
      # than GITHUB_TOKEN's default contents:read grant here). Shallow is
      # enough: the only git work here is ls-remote, resolving main's tip,
      # and one ref push of a commit the server already has.
      # Pinned to an immutable commit SHA; persist-credentials deliberately
      # stays ON here: this job pushes with the automation credential and
      # runs no repo code that could exfiltrate it. An empty mint (the
      # variable is unset) falls back to the job's own read-only
      # GITHUB_TOKEN, and the push below then fails loudly.
      - name: Check out the repo (tip only, automation-credential remote)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (immutable commit pin; repo policy)
        with:
          fetch-depth: 1
          token: ${{ steps.init-app.outputs.token }}
      - name: Bootstrap merge-queue at origin/main HEAD (idempotent)
        run: |
          set -euo pipefail
          if [ -n "$(git ls-remote --heads origin merge-queue)" ]; then
            echo "merge-queue already exists at origin — no-op"
            exit 0
          fi
          git fetch --depth=1 origin main
          sha="$(git rev-parse origin/main)"
          git push origin "${sha}:refs/heads/merge-queue"
          echo "created merge-queue at origin/main HEAD (${sha})"
