# instantiated from policy/templates/self-host/self-review-loop.yml — edit the template, not this file
# Template: self-review-loop — the adoptable scheduled review-loop
# automation: the toolkit, built from source, runs its OWN review loop
# (runReviewLoop over the frozen SelfhostDefaults) against the ADOPTING
# repository's open PRs — fetch → classify → respond → resolve, one
# ≤20-minute scheduled run per slot. Wiring, secrets, the cron-window rule,
# the budget caps, and the I2 single-identity caveat: README.md in this
# directory (policy/templates/self-host/). The trusted build and the
# privileged loop are intentionally split: secret-bearing effects are
# isolated to the main-only privileged job below.
#
# Instantiate: the body writes SELFHOST_DRIVER_KEY in double braces; the
# loop's GitHub credential carries NO placeholder (the mint below names the
# App key and client id literally, so each adopter sets them under these
# names).
#
# CREDENTIAL IDENTITY — per-run mint, no fallback. The loop's GitHub
# credential is the registered cq-automation App, minted PER RUN by the
# privileged job from the `automation` environment secret
# CQ_AUTOMATION_APP_KEY (the App private key) plus the repository variable
# CQ_AUTOMATION_APP_CLIENT_ID (its client id), scoped to this repository
# only. This is the per-run-mint pattern of PR #307
# (policy/templates/adversarial-suite.yml); it supersedes the PR #303
# identity note, which deferred per-run minting as a separately scoped
# behavior change. FAIL-CLOSED: the schedule has no fallback identity, so an
# empty client-id variable or a failed mint refuses the run. The mint step
# is variable-gated, and the loop step asserts the minted token before any
# effect (exit 1) — never a PAT, never the runner's GITHUB_TOKEN. The minted
# token is step-scoped to the loop step and never reaches pnpm install. On
# this repository only, the App needs Pull requests write (review replies
# and thread resolves), Contents write (review-fix pushes) and Issues write
# (top-level PR comments, which ride the issues collection).
#   SELFHOST_DRIVER_KEY     -> NAME of the `automation` ENVIRONMENT
#                              secret (never a repository secret) holding
#                              the model provider API key (the fix workers'
#                              driver through the ai-sdk route).
#   (cron window)           -> HAND-REPLACED slot (the {{COMMANDS...}}
#                              convention from ../README.md): the template
#                              carries THIS repo's three literal crons
#                              (exclude the Z.ai GLM peak, 06:00–10:00 UTC
#                              Mon–Fri, plus 20 minutes of start headroom);
#                              an adopter replaces them BY HAND with THEIR
#                              provider's peak exclusion and run headroom. No
#                              placeholder text is substituted.
# ENVIRONMENT (W1.10 Decision 8): the privileged job runs in environment
# `automation` (main-only branch policy), which holds both secrets; the
# unprivileged worker holds none and needs no environment.
# No ${{ }} expression is ever interpolated into a run: script in this
# workflow — inputs and secrets reach scripts through env: indirection
# only. Drop the result into .github/workflows/. Edit the template, not
# the instantiation.
name: self-review-loop

on:
  schedule:
    # OWNER-MANDATED WINDOW: exclude the Z.ai GLM peak, 06:00–10:00
    # UTC Mon–Fri (14:00–18:00 Asia/Singapore, ~3× quota consumption).
    # Reserve the documented ≤20-minute run BEFORE the peak: no weekday
    # start from 05:40 inclusive to 10:00 exclusive. Three cron lines keep
    # the 15-minute cadence outside that interval: 00:00–05:30 and
    # 10:00–23:45 on weekdays, all day on weekends. The run-step guard
    # enforces the same bounds for delayed fires and manual dispatches.
    # HAND-REPLACED for adopters: align provider peak, run headroom,
    # cron expressions, and guard together.
    - cron: '*/15 0-4,10-23 * * 1-5'
    - cron: '0,15,30 5 * * 1-5'
    - cron: '*/15 * * * 0,6'
  workflow_dispatch:
    inputs:
      max_usd:
        description: Optional USD cap for this run ('' = no USD cap; the default is the token cap, SelfhostDefaults.maxTokens)
        required: false
        default: ''
        type: string
      dry_run:
        description: Fetch + summarize only — post nothing, dispatch nothing
        required: false
        default: false
        type: boolean

# ONE shared serialization group across BOTH self-host workflows
# (review-debt #186): the review loop's fix pushes/replies and the merge
# dispatch's server-side merges mutate the same repo state, so they must
# never interleave — a review push racing a merge executor would invalidate
# the merge's head pin. (The PR-triggered live-review/live-merge drills keep
# their own group; this serializes the two scheduled self-host workflows.)
# A queued run WAITS rather than kills the in-flight sibling
# (cancel-in-progress: false — cancelling mid-loop could strand
# half-dispatched replies; cancelling mid-merge could strand a half-executed
# plan). Fixed group, not per-ref: neither workflow fires on PRs.
# ACCEPTED (review r1): GitHub keeps ONE pending run per group, so a queued
# sibling can replace an older pending run; a dropped cycle simply re-enters
# on the next slot with the persisted journal (no state is lost).
concurrency:
  group: self-host-automation
  cancel-in-progress: false

permissions:
  contents: read

# pnpm-workspace.yaml's global virtual store is a local-worktree speedup
# only: CI installs a conventional per-project node_modules, so no step
# inherits pnpm's NODE_PATH/NODE_OPTIONS resolve hook for shared stores.
env:
  PNPM_CONFIG_VIRTUAL_STORE_TYPE: project

jobs:
  # Unprivileged preparation lane: no repository write token is available to
  # this job. It builds trusted source; the privileged job below owns the
  # authenticated loop and all GitHub effects.
  self-review-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      trusted-commit: ${{ steps.trusted-commit.outputs.commit }}
    steps:
      - name: Check out main (trusted code only)
        id: trusted-checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (immutable commit pin; repo policy)
        with:
          ref: main
          persist-credentials: false
      - name: Record trusted commit
        id: trusted-commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up pnpm (version from package.json packageManager)
        # v6.1.0, immutable commit pin (repo policy)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Set up Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (immutable commit pin; repo policy)
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build from source
        run: pnpm run build
      - name: Upload trusted build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (immutable commit pin; repo policy)
        with:
          name: self-review-dist-${{ github.run_id }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  # Privileged lane: only this job receives the minted App token and provider
  # key. The token is scoped to the loop step; checkout credentials never
  # persist into the worker.
  self-review-privileged:
    if: github.ref == 'refs/heads/main'
    needs: self-review-worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: automation
    permissions:
      contents: write
    # The stage-2 switch gives automation ONE ≤20-minute run per slot; the
    # next slot re-enters with the persisted journal.
    steps:
      - name: Check out main (trusted code only)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (immutable commit pin; repo policy)
        with:
          # PINNED TO MAIN: schedule/dispatch always run main's trusted code
          # under GH_TOKEN — workflow_dispatch accepts any write-
          # collaborator's branch as ref, and that branch's code must never
          # execute here. Branches are validated LOCALLY pre-merge; the
          # automation runs only merged main.
          ref: ${{ needs.self-review-worker.outputs.trusted-commit }}
          # pnpm runs repo code below, so the checkout token must not
          # survive checkout; gh rides GH_TOKEN, not the checkout
          # credential.
          persist-credentials: false
      - name: Set up pnpm (version from package.json packageManager)
        # v6.1.0, immutable commit pin (repo policy)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Set up Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (immutable commit pin; repo policy)
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download trusted build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 (immutable commit pin; repo policy)
        with:
          name: self-review-dist-${{ github.run_id }}
          path: dist
      # DURABLE vs EPHEMERAL under .selfhost/journal: the per-PR dispatch
      # logs (dispatch-<pr>.ndjson) are replyAndResolve's actionId dedupe
      # memory — the one content that MUST survive across scheduled
      # invocations, so this step persists the journal root between runs
      # (each run saves under its own run-id key; the next run restores by
      # the state- prefix). Deliberately ephemeral: the per-run journalDir
      # audit trails (<pr>-<stamp>/) ride along but are not the point, the
      # worktrees themselves live OUTSIDE the journal at .selfhost/worktrees
      # and are NOT cached (cached worktree paths go stale as main advances
      # — the worktree registry re-creates missing entries from
      # refs/pull/<pr>/head), and the registry JSON riding the cache is
      # self-healing for the same reason. Restore runs at this step, before
      # the loop step; the save is a SEPARATE actions/cache/save step AFTER
      # the loop step, gated `if: always()` — the combined action's post-save
      # runs only on job success, so a failed run would lose exactly the
      # dispatch-log state the next run must dedupe against.
      - name: Restore the journal state (dispatch-log dedupe memory)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 (immutable commit pin; repo policy)
        with:
          path: .selfhost/journal
          key: self-review-loop-state-${{ github.run_id }}
          restore-keys: |
            self-review-loop-state-
      # Per-run mint, FAIL-CLOSED (no PAT fallback): the schedule has no
      # fallback identity, so an empty client-id variable skips this step and
      # the loop step's assert below refuses the run. `owner` is the
      # repository owner; `repositories` is THIS repository only (never the
      # scratch repo or any other). The App asks for only the permissions the
      # loop uses.
      - name: Mint the cq-automation App token (per run)
        id: self-review-app
        if: vars.CQ_AUTOMATION_APP_CLIENT_ID != ''
        # v3.2.0, immutable commit pin (repo policy)
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          client-id: ${{ vars.CQ_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.CQ_AUTOMATION_APP_KEY }}
          # Review replies (POST pulls/{n}/comments) and thread resolves
          # (resolveReviewThread) — src/ops/review/replyAndResolve.ts.
          permission-pull-requests: write
          # Review-fix pushes to the PR head branch — the loop's `git push`.
          permission-contents: write
          # Top-level PR comments (POST issues/{n}/comments) — replyAndResolve's
          # whole-PR-feedback path (src/plans/review-loop.ts).
          permission-issues: write
      - name: Review loop over this repo's open PRs (dist/selfhost/self-review-loop.js)
        env:
          # The per-run minted App token (step-scoped on purpose: the token
          # must never reach pnpm install's lifecycle scripts — it reaches
          # ONLY this step).
          GH_TOKEN: ${{ steps.self-review-app.outputs.token }}
          # The fix workers' driver (ai-sdk, served model id): without it
          # the loop's dispatches cannot run — asserted below, before any
          # effect. The env NAME is fixed (`ZAI_API_KEY`, what the drivers
          # read); only the SECRET name is the adopter's placeholder.
          ZAI_API_KEY: ${{ secrets.Z_AI_API_KEY }}
          # gh resolves the repo from the environment (effects never pass
          # -R); the entry also receives --repo $GH_REPO explicitly.
          GH_REPO: ${{ github.repository }}
          # Env-indirection doctrine: inputs reach the script as env vars,
          # never as interpolated text. Both are '' on schedule events.
          # The mint action reports the App's slug — the responder identity
          # derives from it (`<slug>[bot]`): installation tokens are NOT
          # supported by `GET /user`, so the login must never be looked up
          # with the minted token.
          APP_SLUG: ${{ steps.self-review-app.outputs.app-slug }}
          MAX_USD: ${{ inputs.max_usd }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Where the entry writes the machine-readable sweep token-usage
          # JSON (D11b) — plain deployment wiring, not a secret; the upload
          # step below publishes it as the SelfhostDefaults.maxTokens
          # cap-tuning evidence. A visible runner-temp path avoids the
          # upload action's default exclusion of dot-prefixed directories.
          SWEEP_USAGE_OUT: ${{ runner.temp }}/sweep-usage.json
        run: |
          # main()'s contract (src/selfhost/self-review-loop.ts): the JSON
          # summary payload plus one sweep-usage JSON line on stdout;
          # exit 0 even with per-PR failures — needs-human outcomes and
          # recorded failures are HONEST results (mirrored to stderr for
          # the workflow log), never a crash that orphans the remaining
          # PRs; only a whole-run throw (bad args, a failed listing) exits
          # 1. pipefail below turns that throw into a red step despite tee.
          set -euo pipefail
          # Peak-window fail-closed guard: reserve the documented
          # ≤20-minute run before the 06:00–10:00 UTC Mon–Fri GLM peak.
          # Refuse starts from 05:40 inclusive to 10:00 exclusive, including
          # delayed fires and manual dispatches; exit 0 is an honest no-op.
          # Runs BEFORE secret asserts so rotated/absent secrets during the
          # exclusion are a scheduling fact, not a credential failure.
          # Adopters must align provider peak, run headroom, and cron.
          # %u is weekday 1–7 (Mon–Sun); %H%M is the UTC start time.
          DOW=$(date -u +%u)
          HM=$(date -u +%H%M)
          if [ "$DOW" -le 5 ] && [ "$((10#$HM))" -ge 540 ] && [ "$((10#$HM))" -lt 1000 ]; then
            echo 'outside the scheduled automation window (Z.ai GLM peak plus 20-minute headroom: starts 05:40–10:00 UTC Mon–Fri excluded); refusing to initiate operations' >&2
            exit 0
          fi
          # FAIL-CLOSED credential assert, no PAT fallback: GH_TOKEN is only
          # the per-run mint above, so an empty value means the
          # CQ_AUTOMATION_APP_CLIENT_ID repository variable is unset (the
          # mint step is variable-gated) or the mint produced no token.
          # Refuse before any effect and name the missing pieces.
          test -n "$GH_TOKEN" || { echo 'GH_TOKEN not minted — set the CQ_AUTOMATION_APP_CLIENT_ID repository variable and the CQ_AUTOMATION_APP_KEY environment secret (cq-automation App); refusing to start' >&2; exit 1; }
          test -n "$ZAI_API_KEY" || { echo 'ZAI_API_KEY not set — fix workers cannot dispatch; refusing to start' >&2; exit 1; }
          # Review-fix pushes reach plain `git push` (the checkout drops its credential) — point git at gh's credential helper so the pushes authenticate.
          gh auth setup-git
          # Worker-created commits fail without an identity on hosted runners (the fixer allowlist excludes `git config`) — set the automation identity before any worker runs.
          git config --global user.name 'cq-automation'
          git config --global user.email 'cq-automation@users.noreply.github.com'
          # Installation tokens cannot call `GET /user` — the responder login
          # comes from the mint step's app-slug output (asserted like the
          # token: empty slug means the mint did not run).
          test -n "$APP_SLUG" || { echo 'app slug not minted — the cq-automation App token mint did not run; refusing to start' >&2; exit 1; }
          LOGIN="${APP_SLUG}[bot]"
          # Bash ARRAY, never a string: the expansions stay single words even
          # if a future value carries spaces (an unquoted $ARGS word-splits).
          ARGS=(--repo "$GH_REPO" --responder-login "$LOGIN")
          if [ -n "$MAX_USD" ]; then
            ARGS+=(--max-usd "$MAX_USD")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          node dist/selfhost/self-review-loop.js "${ARGS[@]}" | tee "$GITHUB_STEP_SUMMARY"
      # always() persists a failed run's journal (a success-only post-save would lose the exact dispatch-log state the next run dedupes against); the rolling restore-keys prefix keeps newest state winning.
      - name: Save the journal state (dispatch-log dedupe memory)
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 (immutable commit pin; repo policy)
        if: always()
        with:
          path: .selfhost/journal
          key: self-review-loop-state-${{ github.run_id }}-${{ github.run_attempt }}
      # The sweep token-usage report (D11b): the per-run evidence the
      # 2,000,000-token placeholder cap (SelfhostDefaults.maxTokens) is to
      # be tuned from, so it publishes even when the loop step went red —
      # an over-budget run is exactly the data point the tuning needs. The
      # entry attempts the file even on a whole-run throw, with usage and
      # an error field. A guard no-op or earlier setup failure may still
      # leave no file; warn makes that absence visible. Retention stays
      # the default on purpose: unlike the
      # ephemeral dist handoff above, usage history is the point.
      - name: Upload the sweep token-usage report (cap-tuning evidence)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (immutable commit pin; repo policy)
        if: always()
        with:
          name: self-review-usage-${{ github.run_id }}
          path: ${{ runner.temp }}/sweep-usage.json
          if-no-files-found: warn
