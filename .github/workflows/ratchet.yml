# instantiated from policy/templates/ratchet.yml — edit the template, not this file
# ratchet — lane H slice 2 (goal H4): the REQUIRED ratchet check workflow.
#
# W1.7 / ADR-0004 status: this is the LEGACY, head-defined leg. It runs on
# `pull_request`, so the head's copy of this file decides what it measures —
# it is kept only as today's required check while the trusted pair ships
# alongside it (expand/contract, ADR-0004 D-H.2): `cq-measure.yml` (the
# credential-free head measurement) and `cq-verify.yml` (the default-branch
# `workflow_run` verifier reading definitions from the trust ref's
# `baselines/ratchets.json`). W1.10's cutover (D-H.3 C2) retires this file
# and makes `cq/ratchet` required. Its target/metric pairs must match
# `baselines/ratchets.json` (test-enforced).
#
# T4.2 switch: the checks run through the SHIPPED CLI — one subcommand per op
# (`ratchet.checkRatchet` for the two live metrics, `ratchet.monotonicGuard`
# for the PR diff guard) — instead of the scripts/ratchet-check.mjs driver.
# The engine is built from source (`npm run build` → `dist/cli.js`); the
# legacy driver stays for local use. A failing verdict is the op's DATA (the
# CLI exits 0), so each step asserts the verdict with `jq -e`, turning a fail
# into a red step.
#
# Runs on EVERY pull request (queue PRs AND the baseline-proposal PRs, which
# target merge-queue) and on every push:
#   - the two LIVE checks (typecheck-count, coverage) always run;
#   - the diff monotonicity guard runs on pull_request only (on push the diff
#     is already committed; the guard judged it on the way in).
#
# Invariant I4 — the STRONGEST form, fully unfiltered: NEITHER trigger
# carries any filter (no paths/paths-ignore, no branches/tags on push OR
# pull_request). The pull_request `branches: [merge-queue]` filter this
# workflow once carried is gone (PR-105 round-2 finding): proposal PRs
# previously targeted main, so a merge-queue-filtered pull_request did not
# check baseline changes. They now target merge-queue, while the required
# check remains unfiltered for every PR and push. Both triggers also
# satisfy the denylist-scan REQUIRED_WORKFLOW_CHECKS pairing (ratchet.yml ↔
# ratchet): both triggers present as top-level entries, zero filter keys.
# More trigger surface just means the check runs more often — harmless.
# Skips live nowhere: the ratchet never skips. The check name is 'ratchet'
# (the job's name:, identical to its id — the pairing requires it);
# registration in branch protection is attempted out-of-band by the lane
# leader, not here. Instantiated per policy/templates/required-check.md
# conventions — the action pins are the repo's immutable-commit pins (same as
# ci.yml).
name: ratchet

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ratchet-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ratchet:
    name: ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo (full history — the guard needs the base diff)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (immutable commit pin; repo policy)
        with:
          fetch-depth: 0
          # npm runs repo code below, so the checkout token must not
          # survive checkout (persist-credentials: false).
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (immutable commit pin; repo policy)
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the CLI from source
        run: npm run build
      - name: 'Typecheck ratchet (CLI: ratchet.checkRatchet)'
        run: |
          # The `command` source runs lane C's CheckRunner over a real tsc
          # invocation; `parse: "tsc-text"` applies the shared evidence rule
          # (a clean exit 0 over an empty capture is the authoritative zero,
          # exits 1/2 hand over the diagnostics text, anything else is
          # non-passing evidence). No expression interpolation in the script:
          # the source JSON is a literal.
          out="$(node dist/cli.js ratchet.checkRatchet \
            --ws=. \
            --target=typecheck \
            --metric=typecheck-count \
            --source='{"kind":"command","command":"node","args":["node_modules/typescript/bin/tsc","--noEmit","-p","tsconfig.json","--pretty","false"],"parse":"tsc-text"}')"
          printf '%s\n' "$out"
          printf '%s' "$out" | jq -e '.status == "ok" and .value.verdict == "pass"' >/dev/null
      - name: 'Coverage ratchet (CLI: ratchet.checkRatchet)'
        run: |
          # A stale summary is removed FIRST so a red/crashed suite can never
          # leave yesterday's numbers behind as today's evidence. The `file`
          # source reads the summary and `parse: "coverage-json"` rounds
          # total.lines.pct to one decimal place (the shared granularity law —
          # cross-runner float noise must never become a verdict).
          rm -f coverage/coverage-summary.json
          npx vitest run --coverage
          out="$(node dist/cli.js ratchet.checkRatchet \
            --ws=. \
            --target=coverage \
            --metric=coverage \
            --source='{"kind":"file","path":"coverage/coverage-summary.json","parse":"coverage-json"}')"
          printf '%s\n' "$out"
          printf '%s' "$out" | jq -e '.status == "ok" and .value.verdict == "pass"' >/dev/null
      - name: 'Baseline monotonicity guard (CLI: ratchet.monotonicGuard)'
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        env:
          # Env-indirection doctrine: expression values reach the shell as
          # env vars, never as interpolated text (an empty expression inside
          # a run block is a startup failure).
          PR_BASE: ${{ github.base_ref }}
        run: |
          # A PR may only TIGHTEN committed baselines. Ref mode: the op takes
          # the diff itself over merge-base(base, HEAD)..HEAD with the
          # hardened no-shell argv (no external diff, no textconv, no
          # renames), applies the shared one-decimal coverage re-basis, pairs
          # every deleted baseline with an added one (an unreplaced delete
          # fails), then judges baseline files alone.
          out="$(node dist/cli.js ratchet.monotonicGuard --repo=. --base="origin/${PR_BASE}" --head=HEAD)"
          printf '%s\n' "$out"
          printf '%s' "$out" | jq -e '.status == "ok" and .value.ok == true' >/dev/null
