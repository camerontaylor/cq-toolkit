# ratchet — lane H slice 2 (goal H4): the REQUIRED ratchet check workflow.
#
# Runs the check-mode ratchet on EVERY pull request (queue PRs AND the
# baseline-proposal PRs, which target main) and on every push:
#   - pull_request: `ratchet-check check --base origin/<base_ref>` — live
#     typecheck + coverage baselines AND the diff monotonicity guard over the
#     PR's changes (a PR may only TIGHTEN committed baselines).
#   - push: `ratchet-check check` — live baselines only (the diff is already
#     committed; the guard judged it on the way in).
#
# Invariant I4 — the STRONGEST form, fully unfiltered: NEITHER trigger
# carries any filter (no paths/paths-ignore, no branches/tags on push OR
# pull_request). The pull_request `branches: [merge-queue]` filter this
# workflow once carried is gone (PR-105 round-2 finding): proposal PRs
# generated by ratchet-propose.mjs target MAIN, so a merge-queue-filtered
# pull_request never ran the ratchet on them — the exact PRs that move
# baselines would have been unchecked. Unfiltered push + pull_request also
# satisfies the denylist-scan REQUIRED_WORKFLOW_CHECKS pairing (ratchet.yml ↔
# ratchet): both triggers present as top-level entries, zero filter keys.
# More trigger surface just means the check runs more often — harmless.
# Skips live nowhere: the ratchet never skips. The check name is 'ratchet'
# (the job's name:, identical to its id — the pairing requires it);
# registration in branch protection is attempted out-of-band by the lane
# leader, not here. Instantiated per policy/templates/required-check.md
# conventions — the action pins are the repo's immutable-commit pins (same as
# ci.yml).
name: ratchet

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ratchet-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ratchet:
    name: ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repo (full history — the guard needs the base diff)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (immutable commit pin; repo policy)
        with:
          fetch-depth: 0
          # npm runs repo code below, so the checkout token must not
          # survive checkout (persist-credentials: false).
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (immutable commit pin; repo policy)
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Ratchet check
        env:
          PR_BASE: ${{ github.base_ref }}
        run: |
          # Env-indirection doctrine: no textual ${{ }} interpolation inside
          # the run script (expression values reach the shell as env vars,
          # never as interpolated text). GITHUB_EVENT_NAME is an Actions
          # default environment variable.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            node scripts/ratchet-check.mjs check --base "origin/${PR_BASE}"
          else
            node scripts/ratchet-check.mjs check
          fi
