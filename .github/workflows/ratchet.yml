# instantiated from policy/templates/ratchet.yml — edit the template, not this file
# Advisory baseline monotonicity guard and one issue when a main PR loosens a
# baseline. This workflow runs no test suite: coverage is measured once per PR
# by cq-measure and judged with typecheck-count by cq-verify (`cq/ratchet`),
# and the required `static` check already runs the typecheck ratchet.
name: ratchet

on:
  pull_request:

permissions:
  contents: read

# Supersede older diagnostics for the same event and ref.
concurrency:
  group: ratchet-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# pnpm-workspace.yaml's global virtual store is a local-worktree speedup
# only: CI installs a conventional per-project node_modules, so no step
# inherits pnpm's NODE_PATH/NODE_OPTIONS resolve hook for shared stores.
env:
  PNPM_CONFIG_VIRTUAL_STORE_TYPE: project

jobs:
  ratchet:
    name: ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # One output per failure cause (5a9fc790): a tool failure (a crashing
      # CLI, a missing jq, an op-level error) is NOT a baseline rejection and
      # must not be reported as one. The verdict is three-way (F2 on PR
      # #1535): 'passed' when the op judged the diff clean, 'loosened' only
      # when it rejected the diff, 'error' when the op itself failed or the
      # output is not valid JSON.
      verdict: ${{ steps.monotonic.outputs.verdict }}
      drop: ${{ steps.monotonic.outcome == 'failure' }}
    steps:
      - name: Check out the repo (full history — the guard needs the base diff)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (immutable commit pin; repo policy)
        with:
          fetch-depth: 0
          # pnpm runs repo code below, so the checkout token must not
          # survive checkout (persist-credentials: false).
          persist-credentials: false
      - name: Set up pnpm (version from package.json packageManager)
        # v6.1.0, immutable commit pin (repo policy)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Set up Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (immutable commit pin; repo policy)
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the CLI from source
        run: pnpm run build
      - name: 'Baseline monotonicity guard (CLI: ratchet.monotonicGuard)'
        id: monotonic
        continue-on-error: ${{ github.base_ref == 'main' }}
        env:
          # Env-indirection doctrine: expression values reach the shell as
          # env vars, never as interpolated text (an empty expression inside
          # a run block is a startup failure).
          PR_BASE: ${{ github.base_ref }}
        run: |
          # A PR may only TIGHTEN committed baselines. Ref mode: the op takes
          # the diff itself over merge-base(base, HEAD)..HEAD with the
          # hardened no-shell argv (no external diff, no textconv, no
          # renames), applies the shared one-decimal coverage re-basis, pairs
          # every deleted baseline with an added one (an unreplaced delete
          # fails), then judges baseline files alone.
          out="$(node dist/cli.js ratchet.monotonicGuard --repo=. --base="origin/${PR_BASE}" --head=HEAD)" || op_rc=$?
          printf '%s\n' "$out"
          # The exact verdict reaches the job outputs through GITHUB_OUTPUT.
          # 'loosened' covers every ok:false rejection — loosened values,
          # direction/unit changes, unreplaced deletes, unparsable diffs —
          # so the issue body can speak of a REJECTED diff without naming a
          # cause the op did not report (F1 on PR #1535). A nonzero CLI exit
          # (failed / needs-human / indeterminate / budget-exhausted) or
          # unparsable output lands on 'error' — captured through the `||
          # op_rc=$?` guard because set -e would otherwise abort before the
          # verdict is written (r2 review F3 on PR #1535).
          verdict=error
          if [ "${op_rc:-0}" -eq 0 ] && printf '%s' "$out" | jq -e '.status == "ok" and .value.ok == true' >/dev/null 2>&1; then
            verdict=passed
          elif [ "${op_rc:-0}" -eq 0 ] && printf '%s' "$out" | jq -e '.status == "ok" and .value.ok == false' >/dev/null 2>&1; then
            verdict=loosened
          fi
          printf 'verdict=%s\n' "$verdict" >> "$GITHUB_OUTPUT"
          printf '%s' "$out" | jq -e '.status == "ok" and .value.ok == true' >/dev/null

  propose-drop:
    # Fork tokens may be read-only; reporting remains advisory.
    continue-on-error: true
    needs: ratchet
    if: github.base_ref == 'main' && needs.ratchet.outputs.verdict == 'loosened'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the ratchet issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Walk the issues connection to exhaustion (gh issue list has no
          # --paginate flag; the search API caps at 1,000 results), so the
          # exact-title issue cannot hide behind a page boundary (b8b49449;
          # F3 on PR #1535). The endpoint is double-quoted so ${GH_REPO}
          # expands — single quotes pass it literally and gh 404s (r2 review
          # F1 on PR #1535). jq emits one line per exact-title match per
          # page, so head -n1 collapses duplicate titles across pages to a
          # single first match (r2 review F2 on PR #1535); an API error
          # aborts the step without writing an issue.
          issue="$(gh api "repos/${GH_REPO}/issues?state=open&per_page=100" --paginate --jq '.[] | select(.pull_request == null and .title == "ratchet") | .number' | head -n1)"
          # Every ok:false verdict is a REJECTION — loosened values, deleted
          # baselines, direction/unit changes, unparsable diffs — so the
          # body claims only that; the run URL carries the specific
          # violation lines (F1 on PR #1535).
          body="Ratchet baseline monotonicity guard rejected the baseline diff on PR #${PR_NUMBER}. Evidence: ${RUN_URL}"
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body "$body"
          else
            gh issue create --title ratchet --body "$body"
          fi
