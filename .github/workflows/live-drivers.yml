# The LIVE drivers wiring — T1.7 slice 3 (the live-CI legs' only home).
#
# Runs the opt-in LIVE legs against real provider endpoints, MANUAL DISPATCH
# ONLY (never on pull_request, never on push — a live run spends real money
# and needs secrets, so nothing automatic may fire it):
#
#   1. The eval-axes demo's Z.ai ai-sdk cell. DeepSeek remains an optional
#      local route; CI holds no DEEPSEEK_API_KEY.
#   2. Other lanes (claude-code and acp) require vendor CLIs and are not wired.
#   3. The DD-1 abort spike's ai-sdk lane (scripts/dd1-abort-spike.mjs
#      --lane ai-sdk — the measured abort-vs-spend evidence run).
#
# SECRETS: this file carries NAMES only. The values arrive as `drill`
# environment secrets (Z_AI_API_KEY). A missing selected-provider key fails
# loudly at the scripts' credential gates, never a
# silent skip. Spend discipline: every leg caps itself (Budget.maxUsd 2 /
# maxTokens, MAX_ATTEMPTS, the governed wall clock); the demo and spike are
# the same bounded scripts the executor ran locally per the T1.6 keys rule.
#
# ENVIRONMENT (W1.10 Decision 8; closes #170): the job runs in environment
# `drill` (main-only branch policy, owner review allowed), which holds the
# provider keys. A dispatch from any other ref fails at job admission, before
# any key is exposed.
name: live-drivers

on:
  workflow_dispatch:

# One live run at a time: a second dispatch queues behind the in-flight one
# (cancel-in-progress: false — cancelling a live run still spends its
# tokens; queueing avoids duplicated paid work). Fixed group, not per-ref:
# this workflow never fires on PRs, so there is nothing per-ref to isolate.
concurrency:
  group: live-drivers
  cancel-in-progress: false

permissions:
  contents: read

# pnpm-workspace.yaml's global virtual store is a local-worktree speedup
# only: CI installs a conventional per-project node_modules, so no step
# inherits pnpm's NODE_PATH/NODE_OPTIONS resolve hook for shared stores.
env:
  PNPM_CONFIG_VIRTUAL_STORE_TYPE: project

jobs:
  live-drivers:
    # Dispatch is an allowed carrier only on the default ref (D-A.1): a
    # dispatch on any other ref would run that ref's copy of this file.
    if: >-
      github.ref ==
      format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: drill
    env:
      # Names only — the values live in the `drill` environment's secrets.
      Z_AI_API_KEY: ${{ secrets.Z_AI_API_KEY }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (immutable commit pin; repo policy)
        with:
          # pnpm runs repo code below, so the checkout token must not
          # survive checkout (persist-credentials: false).
          persist-credentials: false
      - name: Install ripgrep for harness search tools
        uses: ./.github/actions/install-ripgrep
      - name: Set up pnpm (version from package.json packageManager)
        # v6.1.0, immutable commit pin (repo policy)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Set up Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (immutable commit pin; repo policy)
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The demo and the spike import the BUILT barrel (dist/index.js).
      - name: Build
        run: pnpm run build
      # Native DeepSeek is opt-in locally; no deleted secret is required here.
      - name: Eval-axes demo — the Z.ai ai-sdk cell
        run: node scripts/demo-eval-axes.mjs --only ai-sdk/glm
      - name: DD-1 abort spike — the ai-sdk lane
        run: node scripts/dd1-abort-spike.mjs --lane ai-sdk
