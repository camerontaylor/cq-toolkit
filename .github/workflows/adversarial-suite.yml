# instantiated from policy/templates/adversarial-suite.yml — edit the template, not this file
# adversarial-suite — manual live §7 probes against an isolated scratch repo.
# Instantiate with no tokens. Edit this template, not its workflow copy.
# The script checks owner/admin authority, outsider trust, applies the selected
# scratch repository variables, then reads them back. No scheduled trigger.
#
# Credential identity (ADR-0004 note N19): the scratch-administration
# credential is the dedicated cq-adversarial-scratch App, installed on the
# scratch repository ONLY (never this repository) with Variables read/write and
# Environments read. The job mints a scratch-repo
# installation token per run from CQ_ADVERSARIAL_APP_KEY and the
# CQ_ADVERSARIAL_APP_CLIENT_ID variable: a static installation token expires
# with nothing to re-mint it, and dispatch-only drills need no refresh path
# when they mint per run. Until the App is registered the mint step is
# skipped and the interim CQ_ADVERSARIAL_PROFILE_TOKEN PAT drives the same
# runner — the env indirection lets either identity drive the same code.
# The mint step continues on error so a failed mint never aborts the job
# before the runner records per-row BLOCKED evidence; the interim PAT
# fallback applies only while the client id is empty (App not yet
# registered) — once the client id is set, a failed mint yields an empty
# token and the runner's preflight records BLOCKED evidence (exit 3).
# The primary (CQ_ADVERSARIAL_TOKEN) and outsider
# (CQ_ADVERSARIAL_SECOND_TOKEN) identities
# stay the two interim PATs until the runner's preflight learns to verify
# non-human identities; all three interim names are gone at C3.
name: adversarial-suite

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Existing scratch repository (owner/cq-scratch-v11-adversarial)'
        required: true
        type: string
      fixture_pr:
        description: 'Existing scratch pull request number for review and thread probes'
        required: true
        type: number
      rows:
        description: 'Comma-separated §7 row IDs; empty uses the W1-ready set'
        required: false
        type: string

permissions:
  contents: read

# Scratch repository variables are shared mutable state: serialize across runs,
# not just across matrix jobs (max-parallel only covers one run).
concurrency:
  group: adversarial-scratch-repository
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: adversarial-scratch
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile: [blank, solo-maintainer]
    steps:
      - name: Check scratch target and dispatch ref
        env:
          SCRATCH_REPOSITORY: ${{ inputs.repository }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Fail, not skip: a skipped matrix would look like a clean run.
          if [[ "$DISPATCH_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo 'refusing: dispatch only from the default branch'
            exit 1
          fi
          if [[ "$SCRATCH_REPOSITORY" != "camerontaylor/cq-scratch-v11-adversarial" ]] || \
             [[ "$SCRATCH_REPOSITORY" == "$SOURCE_REPOSITORY" ]]; then
            echo 'refusing: target must be the dedicated cq-scratch-v11-adversarial repository'
            exit 1
          fi
          # Credential presence, distinct identities and the scratch repository
          # lookup are the runner's preflight: it records each failure as
          # per-row BLOCKED evidence (exit 3) instead of leaving no artifact.
      - name: Check out trusted suite code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: ''
      - name: Mint the scratch App token (when the App is registered)
        id: adversarial-app
        if: vars.CQ_ADVERSARIAL_APP_CLIENT_ID != ''
        continue-on-error: true
        # v3.2.0, immutable commit pin (repo policy)
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          owner: camerontaylor
          repositories: cq-scratch-v11-adversarial
          client-id: ${{ vars.CQ_ADVERSARIAL_APP_CLIENT_ID }}
          private-key: ${{ secrets.CQ_ADVERSARIAL_APP_KEY }}
          permission-variables: write
          permission-environments: read
      - name: Apply and verify scratch profile; collect row evidence
        env:
          SCRATCH_REPOSITORY: ${{ inputs.repository }}
          PROFILE: ${{ matrix.profile }}
          CQ_ADVERSARIAL_PR: ${{ inputs.fixture_pr }}
          ROWS: ${{ inputs.rows }}
          GH_TOKEN: ${{ secrets.CQ_ADVERSARIAL_TOKEN }}
          CQ_ADVERSARIAL_SECOND_TOKEN: ${{ secrets.CQ_ADVERSARIAL_SECOND_TOKEN }}
          # App token when minted; interim PAT only while the client id is
          # empty (App not yet registered); empty when the App is armed and
          # minting failed — the runner's preflight then records per-row
          # BLOCKED evidence and exits 3.
          CQ_ADVERSARIAL_PROFILE_TOKEN: ${{ steps.adversarial-app.outputs.token || (vars.CQ_ADVERSARIAL_APP_CLIENT_ID == '' && secrets.CQ_ADVERSARIAL_PROFILE_TOKEN) || '' }}
        run: |
          set -euo pipefail
          node scripts/adversarial-suite.mjs \
            --repo="$SCRATCH_REPOSITORY" \
            --profile="$PROFILE" \
            --rows="$ROWS"
      - name: Preserve probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: adversarial-${{ matrix.profile }}
          path: artifacts/adversarial-suite/evidence-${{ matrix.profile }}.json
          if-no-files-found: warn
          retention-days: 30
