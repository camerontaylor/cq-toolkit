# instantiated from policy/templates/observe-prs-wake.yml — edit the template, not this file
# No checkout, environment or secret: only dispatch the default-branch observer.
name: observe-prs-wake
on:
  workflow_run:
    workflows: [cq-signal]
    types: [completed]
permissions: {}
jobs:
  # Reuse the default-branch signal carrier also used by cq-accept.
  # The upstream payload is never code or an observation tuple.
  wake:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch default-branch observation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run observe-prs.yml --ref "$DEFAULT_BRANCH"
