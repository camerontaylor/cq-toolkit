# instantiated from policy/templates/cq-policy.yml — edit the template, not this file
# Advisory PR diagnostics for direct main development. No queue promotion carrier.
name: cq-policy

on:
  pull_request:
  workflow_run:
    workflows:
      - cq-signal
    types:
      - completed
  workflow_dispatch:
    inputs:
      signal_run_id:
        description: 'cq-signal run id to judge (its head_sha is the subject)'
        required: true

permissions: {}

concurrency:
  group: cq-policy-${{ github.event.workflow_run.id || inputs.signal_run_id }}
  cancel-in-progress: false

# pnpm-workspace.yaml's global virtual store is a local-worktree speedup
# only: CI installs a conventional per-project node_modules, so no step
# inherits pnpm's NODE_PATH/NODE_OPTIONS resolve hook for shared stores.
env:
  PNPM_CONFIG_VIRTUAL_STORE_TYPE: project

jobs:
  main-advisory:
    name: cq/policy (advisory)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report advisory policy
        run: echo 'Direct main PRs use CI and denylist; this verdict is advisory.'
  resolve:
    name: resolve
    # Dispatch is an allowed carrier only on the default ref (D-A.1): a
    # dispatch on any other ref would run that ref's copy of this file.
    if: >-
      github.event_name != 'pull_request' && (
      github.event_name == 'workflow_run' ||
      github.ref ==
      format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      subject: ${{ steps.run.outputs.subject }}
      kind: ${{ steps.run.outputs.kind }}
      base: ${{ steps.run.outputs.base }}
      pr: ${{ steps.run.outputs.pr }}
    steps:
      - name: Verify the triggering run and resolve the subject
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.signal_run_id }}
        run: |
          set -euo pipefail
          case "$RUN_ID" in
            ''|*[!0-9]*)
              echo "refusing: run id '$RUN_ID' is not numeric"
              exit 1;;
          esac
          # Re-read the run from the API by id: the fields below are the
          # server's, not a payload a dispatcher could shape.
          run="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}")"
          path="$(jq -r '.path' <<<"$run")"
          event="$(jq -r '.event' <<<"$run")"
          head_repo="$(jq -r '.head_repository.id' <<<"$run")"
          subject="$(jq -r '.head_sha' <<<"$run")"
          branch="$(jq -r '.head_branch' <<<"$run")"
          [ "$path" = ".github/workflows/cq-signal.yml" ] || {
            echo "refusing: run path '$path'"; exit 1; }
          [ "$head_repo" = "$REPO_ID" ] || {
            echo "refusing: fork or foreign run (repo id $head_repo)"
            exit 1; }
          [[ "$subject" =~ ^[0-9a-f]{40}$ ]] || {
            echo "refusing: head_sha '$subject'"; exit 1; }
          pr=''
          case "$event" in
            pull_request|pull_request_review|pull_request_review_comment)
              # The subject is head_sha; the PR (and its base) comes from
              # the commit→PR API, never from pull_requests[]
              # (ADR-0004 D-C.2). Exactly one open same-repo PR into
              # main must carry the subject as its head:
              # the label record is per PR, so an ambiguous PR is refused.
              # Every page, slurped into one array; an API error fails the
              # step (assignment under `set -e`, `pipefail`).
              list_pulls() {
                gh api --paginate \
                  "repos/${REPO}/commits/${subject}/pulls?per_page=100" \
                  | jq -s 'add // []'
              }
              match_pulls() {
                jq -c --arg sha "$subject" --argjson repo "$REPO_ID" \
                  '[.[] | select(.state == "open"
                     and .head.sha == $sha
                     and .head.repo.id == $repo
                     and .base.ref == "main")
                     | {number, base: .base.ref}]' <<<"$pulls"
              }
              pulls="$(list_pulls)"
              matches="$(match_pulls)"
              count="$(jq 'length' <<<"$matches")"
              if [ "$count" = 0 ]; then
                # The commit→PR association can lag a push, and nothing
                # re-runs this verdict: look once more before skipping.
                sleep "${CQ_ASSOC_RETRY_SECONDS:-20}"
                pulls="$(list_pulls)"
                matches="$(match_pulls)"
                count="$(jq 'length' <<<"$matches")"
              fi
              case "$count" in
                0)
                  # NOTHING TO JUDGE, not a refusal (cq-accept's rule): the
                  # PR has moved past this head (superseded), is closed or
                  # merged, or targets another base (a stacked PR). No
                  # verdict is posted, `judge` is skipped and the run stays
                  # green. A current head gets its own cq-signal run and
                  # verdict; the gate recomputes policy itself. An empty
                  # association even after the retry is reported as
                  # unconfirmed, not as a superseded or closed PR.
                  carriers="$(jq -r --arg sha "$subject" \
                    --argjson repo "$REPO_ID" '
                    [.[] | select(.head.repo.id == $repo)
                     | "#\(.number) \(.state) into \(.base.ref)"
                       + (if .head.sha == $sha then ""
                          else " (head moved to \(.head.sha[0:12]))" end)]
                    | join("; ")' <<<"$pulls")"
                  if [ -z "$carriers" ]; then
                    msg="nothing to judge: commit→PR association unconfirmed: no same-repo PR lists ${subject} (looked twice)"
                  else
                    msg="nothing to judge: no open same-repo PR into main has head ${subject} (same-repo PRs containing it: ${carriers})"
                  fi
                  echo "::notice title=cq-policy::${msg}"
                  echo "$msg" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
                  exit 0;;
                1) ;;
                *)
                  echo "refusing: ${count} open same-repo PRs"
                  echo "into main have head ${subject}"
                  exit 1;;
              esac
              pr="$(jq -r '.[0].number' <<<"$matches")"
              base="$(jq -r '.[0].base' <<<"$matches")"
              [[ "$pr" =~ ^[0-9]+$ ]] || {
                echo "refusing: PR number '$pr'"; exit 1; }
              kind='pr'
              ;;
            *) echo "refusing: event '$event'"; exit 1;;
          esac
          {
            echo "subject=${subject}"
            echo "kind=${kind}"
            echo "base=${base}"
            echo "pr=${pr}"
          } >> "$GITHUB_OUTPUT"

  judge:
    name: judge
    needs: resolve
    continue-on-error: ${{ needs.resolve.outputs.kind == 'pr' && needs.resolve.outputs.base == 'main' }}
    # An empty subject is resolve's "nothing to judge" (no verdict owed).
    if: github.event_name != 'pull_request' && needs.resolve.outputs.subject != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The verdict signer's environment (Decision 6): its only secret is the
    # verdict App key, reached only by the mint step below.
    environment: cq-verdict
    # Read scopes for the trust checkout, the object fetch and the timeline;
    # `checks: write` is the verdict's own scope (used only when no verdict
    # App token is minted). This job runs trusted code over head DATA.
    permissions:
      contents: read
      checks: write
      pull-requests: read
      issues: read
    env:
      # The posture (Annex B §B.6.3). Blank or unset = `human`.
      CQ_MERGE_PROTECTED_PATHS: ${{ vars.CQ_MERGE_PROTECTED_PATHS }}
    steps:
      - name: Refuse a half-registered verdict App (paired vars)
        # Posters mint on the client id; the gate and the sweep dedupe
        # select on the numeric id. Exactly one set would make them
        # disagree about which app is authoritative (Decision 6).
        env:
          APP_ID: ${{ vars.CQ_VERDICT_APP_ID }}
          CLIENT_ID: ${{ vars.CQ_VERDICT_APP_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ "${APP_ID:+set}" != "${CLIENT_ID:+set}" ]; then
            echo 'refusing: set vars.CQ_VERDICT_APP_ID and'
            echo 'vars.CQ_VERDICT_APP_CLIENT_ID together (exactly one is set)'
            exit 1
          fi
      - name: Check out the trust ref (the default branch)
        # v5.1.0, immutable commit pin (repo policy)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: trust
          fetch-depth: 0
          # The object fetch below scopes its own credential to that step;
          # nothing persists into the trusted build or the verifier.
          persist-credentials: false
      - name: Set up pnpm (version from package.json packageManager)
        # v6.1.0, immutable commit pin (repo policy)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: trust/package.json
      - name: Set up Node 24 (no cache — deciding jobs restore nothing, D-C.7)
        # v5.0.0, immutable commit pin (repo policy)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: ''
      - name: Install and build the trusted toolkit
        working-directory: trust
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build
      - name: Fetch the subject, base and cq-state objects (no checkout)
        id: objects
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.resolve.outputs.base }}
          SUBJECT: ${{ needs.resolve.outputs.subject }}
        run: |
          set -euo pipefail
          # A step-scoped read-only credential, passed through git's
          # environment config (never argv, never .git/config), so it ends
          # with this step.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          git -C trust fetch --no-tags origin "$SUBJECT" \
            "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
          git -C trust cat-file -e "${SUBJECT}^{commit}"
          # cq-state (the settle ledger) may not exist yet: only its
          # ABSENCE is tolerated (ls-remote exit 2); any other failure
          # fails the step. Without it no label record can be valid.
          rc=0
          git -C trust ls-remote --exit-code origin \
            refs/heads/cq-state >/dev/null || rc=$?
          settle=''
          case "$rc" in
            0)
              git -C trust fetch --no-tags origin \
                '+refs/heads/cq-state:refs/remotes/origin/cq-state'
              settle='refs/remotes/origin/cq-state'
              ;;
            2) echo 'cq-state is absent: no settle ledger to read';;
            *) echo "ls-remote cq-state failed (exit $rc)"; exit 1;;
          esac
          echo "settle_ref=${settle}" >> "$GITHUB_OUTPUT"
      - name: Fetch the PR timeline label events (API data, not head bytes)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KIND: ${{ needs.resolve.outputs.kind }}
          PR: ${{ needs.resolve.outputs.pr }}
        run: |
          set -euo pipefail
          [ "$KIND" = 'pr' ] || exit 0
          [[ "$PR" =~ ^[0-9]+$ ]] || {
            echo "refusing: PR number '$PR'"; exit 1; }
          # Chronological API order is kept: the current application is
          # the last `labeled` event with no later `unlabeled`.
          gh api --paginate "repos/${REPO}/issues/${PR}/timeline" \
            --jq '.[] | select(.event == "labeled"
              or .event == "unlabeled")' |
            jq -s '.' > "${RUNNER_TEMP}/label-events.json"
          jq -e 'type == "array"' "${RUNNER_TEMP}/label-events.json" \
            >/dev/null
      - name: 'Judge (in-process: gates.policyDiff)'
        env:
          TRUST: ${{ github.sha }}
          SUBJECT: ${{ needs.resolve.outputs.subject }}
          KIND: ${{ needs.resolve.outputs.kind }}
          BASE: ${{ needs.resolve.outputs.base }}
          PR: ${{ needs.resolve.outputs.pr }}
          OWNER_ID: ${{ github.repository_owner_id }}
          SETTLE_REF: ${{ steps.objects.outputs.settle_ref }}
        run: |
          set -euo pipefail
          verdict="${RUNNER_TEMP}/verdict.json"
          args=(
            --repo=trust
            --trustRef="$TRUST"
            --subject="$SUBJECT"
            --subjectKind="$KIND"
            --base="refs/remotes/origin/${BASE}"
          )
          if [ "$KIND" = 'pr' ]; then
            # Numeric flags must be positive decimal integers (entry-args).
            [[ "$PR" =~ ^[0-9]+$ ]] || {
              echo "refusing: PR number '$PR'"; exit 1; }
            [[ "$OWNER_ID" =~ ^[0-9]+$ ]] || {
              echo "refusing: owner id '$OWNER_ID'"; exit 1; }
            args+=(
              --pr="$PR"
              --repository="$GITHUB_REPOSITORY"
              --ownerId="$OWNER_ID"
              --labelEventsPath="${RUNNER_TEMP}/label-events.json"
            )
            if [ -n "$SETTLE_REF" ]; then
              args+=(--settleRef="$SETTLE_REF")
            fi
          fi
          node trust/dist/selfhost/policy-diff.js "${args[@]}" \
            > "$verdict" || true
          if ! jq -e -s \
            'length == 1 and (.[0] | type) == "object"
             and (.[0].status | type) == "string"
             and (.[0].value == null or (.[0].value | type) == "object")
             and (.[0].error == null or (.[0].error | type) == "string")
             and (.[0].detail == null or (.[0].detail | type) == "string")
             and (.[0].status != "ok" or
               ((.[0].value | type) == "object"
                and (.[0].value.verdict
                  | IN("pass", "fail", "needs-human"))
                and (.[0].value.posture | type) == "string"
                and (.[0].value.postureLayer | type) == "string"
                and (.[0].value.report | type) == "array"
                and all(.[0].value.report[]; type == "string")))' \
            "${RUNNER_TEMP}/verdict.json" >/dev/null 2>&1; then
            msg='policy check emitted no valid JSON result'
            printf '%s\n' "{\"status\":\"failed\",\"error\":\"$msg\"}" \
              > "${RUNNER_TEMP}/verdict.json"
          fi
          cat "${RUNNER_TEMP}/verdict.json"
      - name: Mint the verdict App token (when the App is registered)
        id: verdict-app
        if: vars.CQ_VERDICT_APP_CLIENT_ID != ''
        # v3.2.0, immutable commit pin (repo policy)
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.CQ_VERDICT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CQ_VERDICT_APP_KEY }}
          permission-checks: write
      - name: Post the cq/policy check run and the run report
        env:
          GH_TOKEN: ${{ steps.verdict-app.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          TRUST: ${{ github.sha }}
          SUBJECT: ${{ needs.resolve.outputs.subject }}
          ADVISORY: ${{ needs.resolve.outputs.kind == 'pr' && needs.resolve.outputs.base == 'main' }}
        run: |
          set -euo pipefail
          # Anything but an ok result with verdict "pass" is a failure;
          # needs-human is a failure titled for D11. The summary is the run
          # report (where the cq-override label record is logged), fenced
          # so paths render verbatim, and capped under the API's limit.
          jq -n --slurpfile v "${RUNNER_TEMP}/verdict.json" \
            --arg sha "$SUBJECT" --arg ext "${TRUST}:${SUBJECT}" --arg advisory "$ADVISORY" '
            ($v[0] // {}) as $r
            | ($r.value.verdict // "fail") as $verdict
            | (if $r.status == "ok" then ($r.value.report | join("\n"))
               else (($r.error // $r.detail
                 // "policy check returned no error detail") | tostring)
               end) as $report
            | (if ($report | length) > 60000
               then $report[0:60000] + "\n(report truncated)"
               else $report end) as $report
            | {
                name: "cq/policy",
                head_sha: $sha,
                external_id: $ext,
                status: "completed",
                conclusion: (if $advisory == "true" then "neutral" elif $r.status == "ok" and $verdict == "pass"
                  then "success" else "failure" end),
                output: {
                  title: (if $r.status != "ok"
                    then "policy: check " + ($r.status // "crashed")
                    elif $verdict == "needs-human" then "needs-human (D11)"
                    else "policy: " + $verdict end),
                  summary: ("```text\n"
                    + ($report | gsub("`{3,}"; "` ` `"))
                    + "\n```"
                    + "\n\ntrust ref `" + $ext + "`")
                }
              }' > "${RUNNER_TEMP}/check-run.json"
          {
            echo '## cq/policy'
            echo
            jq -r '"**" + .output.title + "**\n\n" + .output.summary' \
              "${RUNNER_TEMP}/check-run.json"
          } >> "$GITHUB_STEP_SUMMARY"
          gh api -X POST "repos/${REPO}/check-runs" \
            --input "${RUNNER_TEMP}/check-run.json" --jq '.html_url'
          # A fail or needs-human verdict is a RED CHECK RUN, not a red job
          # (cq-accept's rule): cq/policy carries it. The job fails only
          # when the verifier crashed (no ok result) or the post failed.
          if ! jq -e '.status == "ok"' "${RUNNER_TEMP}/verdict.json" \
            >/dev/null; then
            echo 'policy verifier crashed: see the cq/policy check run'
            exit 1
          fi
