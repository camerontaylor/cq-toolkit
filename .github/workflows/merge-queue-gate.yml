# instantiated from policy/templates/merge-queue-gate.yml — edit the template, not this file
# Template: merge-queue-gate — the BATCH PROMOTER (docs/promotion-policy.md):
# fast-forwards main (I3) to a merge-queue commit that carries a promotion
# review, never merely because the queue went green. It promotes a gated
# sha only when ALL hold:
#   - REVIEW: the newest `crq/promotion-review` commit status on the sha
#     that an ALLOWED reviewer posted is `success`, and its description
#     binds the reviewed range as `main=<40-hex>` (that base must be main
#     or an ancestor of main, so main..sha was reviewed). Allowed reviewers
#     are USER accounts named in `vars.CQ_PROMOTION_REVIEWERS` (comma list;
#     blank = the repository owner). A status posted by GITHUB_TOKEN or any
#     App is a Bot and is ignored, so a PR head's workflow cannot forge it.
#     A description starting `override` is the owner's override, logged.
#   - I4: every required check on the gate's wait list SUCCEEDED on the sha
#     (a skipped, cancelled or missing required check is never a pass).
#   - GUARDS: the sha is on merge-queue (an ancestor of, or equal to, its
#     tip), main is an ancestor of the sha, and it is not already in main.
# The REVIEWED sha is what promotes, not whatever the queue tip is now.
#
# Carriers: `status` (crq posting the review wakes the gate; the job runs
# only for a `success` `crq/promotion-review` payload and then re-reads the
# status from the API — the payload is only a lookup key) and
# `workflow_dispatch` with an optional sha (default: the merge-queue tip),
# honoured only on the default ref. GitHub runs the default branch's copy
# for both. No push trigger: a green queue push alone never promotes.
#
# Signal hygiene: WAITING IS NOT FAILING. A sha with no promotion review,
# or whose review is pending or blocked (crq posts `failure` while a
# critical/major finding is unaddressed), ends green with an "awaiting
# promotion review" summary and promotes nothing; so does a sha already in
# main. A red run means a human must act: a review status from a
# non-allowed creator, a reviewed sha whose required checks failed, were
# skipped or cancelled, or never reported in time, a reviewed sha off the
# queue, a review base main does not contain, or a diverged main.
#
# RETIRES AT C2 (W1.10; ADR-0004 D-H.3.1): while the batch policy holds,
# cq-gate (gate.yml) runs REPORT-ONLY, so this gate is the one component
# that advances main. C2 must first teach cq-gate the promotion-review
# signal. It reads the repository-level PROMOTE_SECRET: once the owner
# moves that secret into environment `promote`, this gate fails closed.
#
# Instantiate (each token below is written in double braces in the body):
#   PROMOTE_SECRET   -> NAME of the repo secret holding a PAT with
#                       contents:write. It is used for the checkout
#                       remote (so the ff-push below uses it —
#                       GITHUB_TOKEN pushes do not trigger the
#                       on:push:main sync workflow) and, as GH_TOKEN,
#                       for the check-runs API wait (GITHUB_TOKEN with
#                       contents:read also works for that wait alone).
#   GATE_CHECKS      -> the gate's wait list: comma list of required check
#                       names, e.g. static,denylist
#   GATE_TIMEOUT_MIN -> minutes to wait for the checks before refusing
#                       (default 20)
# No ${{ }} expression is ever interpolated into a run: script in this
# workflow — inputs reach scripts through env: indirection only. Drop the
# result into .github/workflows/. Edit the template, not the instantiation.
name: merge-queue-gate

on:
  status:
  workflow_dispatch:
    inputs:
      sha:
        description: reviewed merge-queue commit to promote (defaults to the merge-queue tip)
        required: false
        default: ''

permissions:
  contents: read
  statuses: read

jobs:
  gate:
    # Two carriers. `status`: only a success crq/promotion-review payload
    # admits the job (every other status — e.g. a review bot's on a PR
    # head — skips it, which is not a failure). Dispatch: admitted only on
    # the default ref (D-A.1): a dispatch on any other ref would run that
    # ref's copy of this file — with the promote credential one job lower.
    # `status` events always run the default branch's copy.
    if: >-
      (github.event_name == 'status' &&
      github.event.context == 'crq/promotion-review' &&
      github.event.state == 'success') ||
      (github.event_name != 'status' &&
      github.ref ==
      format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    # Promotions serialize; a running promotion is never cancelled
    # mid-push. Job-level, so the skipped runs of unrelated statuses never
    # enter (or displace a pending promotion from) the group.
    concurrency:
      group: merge-queue-gate
      cancel-in-progress: false
    steps:
      # The gated sha reaches the script via env: indirection — never a
      # textual ${{ }} interpolation. A status event gates the status's sha
      # (a lookup key: the review is re-read from the API below); dispatch
      # with an explicit sha gates that sha; dispatch without one resolves
      # the merge-queue tip from the API.
      - name: Resolve the gated sha and verify its promotion review (API only)
        id: review
        env:
          SHA_INPUT: ${{ inputs.sha || '' }}
          STATUS_SHA: ${{ github.event.sha || '' }}
          REVIEWERS_VAR: ${{ vars.CQ_PROMOTION_REVIEWERS }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${SHA_INPUT}" ]; then
            sha="${SHA_INPUT}"
          elif [ "${GITHUB_EVENT_NAME}" = "status" ]; then
            sha="${STATUS_SHA}"
          else
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/merge-queue" --jq .object.sha)"
          fi
          [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "refusing: gated sha '${sha}' is not 40 lowercase hex"; exit 1; }
          echo "gating ${sha}"
          echo "SHA=${sha}" >> "$GITHUB_ENV"
          await() {
            echo "awaiting promotion review: $1 — ${sha} not promoted (docs/promotion-policy.md)"
            {
              echo '## merge-queue-gate: awaiting promotion review'
              echo
              echo "\`${sha}\`: $1. Not promoted."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          # Already in main (a later batch promoted past it): nothing to do.
          state="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${sha}" --jq .status)"
          case "${state}" in
            identical|behind)
              echo "no-op: ${sha} is already in main"
              echo "## merge-queue-gate: \`${sha}\` is already in main" >> "$GITHUB_STEP_SUMMARY"
              exit 0;;
          esac
          reviewers="${REVIEWERS_VAR:-${OWNER}}"
          # Every crq/promotion-review status on the sha; the newest one an
          # allowed USER posted is the review (a later failure — a blocking
          # finding — overrides an earlier success).
          rows="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/commits/${sha}/statuses?per_page=100" \
            --jq '.[] | select(.context == "crq/promotion-review")
              | {id, state, description, created_at,
                 login: .creator.login, type: .creator.type}' |
            jq -s --arg allowed "${reviewers}" '
              ($allowed | split(",") | map(gsub("^\\s+|\\s+$"; ""))
                | map(select(length > 0))) as $ok
              | def trusted: .type == "User" and (.login as $l | any($ok[]; . == $l));
              {review: (map(select(trusted)) | max_by([.created_at, .id])),
               others: (map(select(trusted | not)) | length)}')"
          others="$(jq -r '.others' <<<"${rows}")"
          if jq -e '.review == null' <<<"${rows}" >/dev/null; then
            if [ "${GITHUB_EVENT_NAME}" = status ] || [ "${others}" -gt 0 ]; then
              echo "refusing: ${sha} carries ${others} crq/promotion-review status(es), none from an allowed reviewer (${reviewers})"
              exit 1
            fi
            await "no crq/promotion-review status"
          fi
          review_state="$(jq -r '.review.state' <<<"${rows}")"
          description="$(jq -r '.review.description // ""' <<<"${rows}")"
          login="$(jq -r '.review.login' <<<"${rows}")"
          echo "review: ${review_state} by ${login}: ${description}"
          [ "${others}" -eq 0 ] ||
            echo "note: ${others} crq/promotion-review status(es) from non-allowed creators ignored"
          if [ "${review_state}" != success ]; then
            await "the newest review is ${review_state} (${description})"
          fi
          base="$(sed -nE 's/^(.*[[:space:]])?main=([0-9a-f]{40})([[:space:]].*)?$/\2/p' <<<"${description}")"
          [[ "${base}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "refusing: the review on ${sha} binds no reviewed base (description needs main=<40-hex>)"
            exit 1; }
          kind=review
          case "${description}" in override*) kind=override;; esac
          echo "REVIEW_BASE=${base}" >> "$GITHUB_ENV"
          {
            echo "## merge-queue-gate: promoting \`${sha}\`"
            echo
            echo "${kind} by ${login}: reviewed range \`${base}..${sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "promote=true" >> "$GITHUB_OUTPUT"
      - name: Wait for required checks on the gated sha (API only)
        if: steps.review.outputs.promote == 'true'
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: |
          set -euo pipefail
          # EVERY required check belongs on this wait list (README
          # "How instantiation works" step 4): a required check missing here
          # lets the gate fast-forward main while it is pending or failed.
          checks="$(echo 'static,denylist,ratchet' | tr -d ' ' | tr ',' ' ')"
          # Fail closed on an empty gate wait list: an empty list would run
          # the wait loop zero times and promote with NO check validated.
          if [ -z "${checks// /}" ]; then
            echo "refusing: GATE_CHECKS is empty — the gate would promote with zero checks validated"
            exit 1
          fi
          deadline=$(( $(date +%s) + 20 * 60 ))
          while :; do
            failing=0
            waiting=0
            # filter=latest keeps one row per check name PER REPORTING
            # SUITE, not per name: a promoted sha carries same-name rows
            # from both the merge-queue-push suite and the main-push suite,
            # so a required check can appear multiple times. The verdict
            # below therefore folds EVERY matching row into ONE verdict per
            # check name (never a per-row shell read, which would see a
            # multi-line status string and spin to the timeout): waiting if
            # ANY row is incomplete, failing if ANY completed row is
            # non-success (a non-success conclusion is already terminal, so
            # it outranks waiting — fail fast instead of waiting out the
            # clock), passing only when EVERY matching row is
            # completed+success. A `skipped` conclusion is terminal and NEVER a pass: a skipped required check is missing, and missing = failing (invariant I4) — the shell below refuses it explicitly instead of waiting out the clock.
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?filter=latest" \
              --paginate \
              --jq '.check_runs[] | [.name, .status, (.conclusion // "")] | @tsv')"
            for check in ${checks}; do
              verdict="$(printf '%s\n' "${runs}" | awk -F'\t' -v c="${check}" '
                $1 == c {
                  n++
                  if ($2 != "completed") {
                    if (v != "failing" && v != "skipped") { v = "waiting"; d = $2 }
                  } else if ($3 == "skipped") {
                    if (v != "failing") { v = "skipped"; d = $3 }
                  } else if ($3 != "success") {
                    v = "failing"; d = $3
                  }
                }
                END {
                  if (n == 0) print "missing"
                  else if (v == "") print "pass"
                  else print v, d
                }
              ')"
              case "${verdict}" in
                pass)
                  ;;
                missing)
                  echo "waiting: ${check} has not reported on ${SHA} yet"
                  waiting=1
                  ;;
                waiting\ *)
                  echo "waiting: ${check} is ${verdict#waiting } on ${SHA}"
                  waiting=1
                  ;;
                skipped\ *)
                  echo "refusing: ${check} concluded skipped on ${SHA} — a skipped required check is neither pass nor fail (missing = failing, I4)"
                  failing=1
                  ;;
                failing\ *)
                  echo "refusing: ${check} completed with conclusion ${verdict#failing } on ${SHA}"
                  failing=1
                  ;;
              esac
            done
            if [ "${failing}" -ne 0 ]; then
              exit 1
            fi
            if [ "${waiting}" -eq 0 ]; then
              echo "all required checks succeeded on ${SHA}"
              exit 0
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "refusing: timed out after 20 minutes waiting for required checks on ${SHA} — never promote unchecked"
              exit 1
            fi
            sleep 30
          done
      # The review and the wait above are API-only and may end awaiting,
      # refuse or time out — none of those runs may pay for a clone. Full
      # history is needed only by the guards and the push below; the token
      # input re-keys the origin remote to the promote PAT so the ff-push
      # authenticates with it.
      # Pinned to an immutable commit SHA; persist-credentials deliberately
      # stays ON here: this job pushes with the promote PAT and runs no repo
      # code that could exfiltrate it.
      - name: Check out the merge-queue head (full history, promote-token remote)
        if: steps.review.outputs.promote == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (immutable commit pin; repo policy)
        with:
          ref: merge-queue
          fetch-depth: 0
          token: ${{ secrets.PROMOTE_TOKEN }}
      - name: Validate the gated sha
        if: steps.review.outputs.promote == 'true'
        run: |
          set -euo pipefail
          # SHA is SHA_INPUT verbatim when dispatch supplied one — verify it
          # names a real commit in the fetched history before any use.
          git rev-parse --verify "${SHA}^{commit}"
      - name: Fast-forward promote the gated sha to main (guarded)
        if: steps.review.outputs.promote == 'true'
        run: |
          set -euo pipefail
          git fetch origin main merge-queue
          if git merge-base --is-ancestor "${SHA}" origin/main; then
            echo "no-op: ${SHA} is already an ancestor of main (already promoted)"
            exit 0
          fi
          # Queue guard: the gate promotes only a commit ON merge-queue (the
          # tip or an ancestor of it — the REVIEWED batch tip, which newer
          # merges may already have passed). A manual dispatch must never
          # promote an off-queue commit.
          queue_tip="$(git rev-parse origin/merge-queue)"
          if ! git merge-base --is-ancestor "${SHA}" "${queue_tip}"; then
            echo "refusing: ${SHA} is not on merge-queue (not an ancestor of the merge-queue tip ${queue_tip}) — promotion advances main along the queue only"
            exit 1
          fi
          if ! git merge-base --is-ancestor origin/main "${SHA}"; then
            echo "refusing: main has diverged from merge-queue (origin/main is not an ancestor of ${SHA}) — merge main into merge-queue and let the gate re-run"
            exit 1
          fi
          # Review binding: the reviewed range is REVIEW_BASE..SHA, so it
          # covers main..SHA only when REVIEW_BASE is main or an ancestor.
          if ! git cat-file -e "${REVIEW_BASE}^{commit}" 2>/dev/null ||
            ! git merge-base --is-ancestor "${REVIEW_BASE}" origin/main; then
            echo "refusing: the review's base ${REVIEW_BASE} is not in main, so main..${SHA} holds unreviewed commits — re-review from main"
            exit 1
          fi
          # Fast-forward only: no --force, so the server rejects any update
          # that is not a fast-forward of main (a concurrent promotion).
          if ! git push origin "${SHA}:refs/heads/main"; then
            git fetch origin main
            if git merge-base --is-ancestor "${SHA}" origin/main; then
              echo "no-op: main reached ${SHA} during the push (already promoted)"
              exit 0
            fi
            echo "refusing: the fast-forward push of ${SHA} was rejected"
            exit 1
          fi
          echo "promoted ${SHA} to main by pure fast-forward (reviewed range ${REVIEW_BASE}..${SHA})"
