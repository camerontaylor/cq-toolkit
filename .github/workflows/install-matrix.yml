# Optional SDK: focused PR checks; full two-peer-mode suites nightly and before release
# via workflow_dispatch. Repo-owned non-template (policy/templates/instances.json).
name: install-matrix

on:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - 'src/**'
      - 'tsconfig*.json'
      - 'vitest*.ts'
      - '.oxlint*'
      - 'lint/**'
      - 'test/driver/**'
      - test/suite-classes.json
      - test/global-setup.ts
      - 'test/helpers/**'
      - 'scripts/**'
      - '.github/actions/**'
      - .github/workflows/install-matrix.yml
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

# pnpm-workspace.yaml's global virtual store is a local-worktree speedup
# only: CI installs a conventional per-project node_modules, so no step
# inherits pnpm's NODE_PATH/NODE_OPTIONS resolve hook for shared stores.
env:
  PNPM_CONFIG_VIRTUAL_STORE_TYPE: project

jobs:
  without-peer:
    name: build+test without the optional agent SDK peer
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (immutable commit pin; repo policy)
        with:
          # pnpm runs repo code below, so the checkout token must not
          # survive checkout (persist-credentials: false).
          persist-credentials: false
      - name: Install ripgrep for harness search tools
        uses: ./.github/actions/install-ripgrep
      - name: Set up pnpm (version from package.json packageManager)
        # v6.1.0, immutable commit pin (repo policy)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Set up Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (immutable commit pin; repo policy)
        with:
          node-version: 24
          cache: pnpm
      # Plain ci: the optional peer is NOT installed (never in the lockfile).
      - name: Install dependencies (optional peer absent)
        run: pnpm install --frozen-lockfile
      - name: Assert optional peer is absent
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          assert.throws(() => import.meta.resolve('@anthropic-ai/claude-agent-sdk'),
            { code: 'ERR_MODULE_NOT_FOUND' });
          NODE
      # The typecheck gate IS this ratchet step (same posture as ci.yml).
      - name: Compiler and typed lint
        run: node scripts/ratchet-typecheck.mjs
      - name: SDK driver tests (PR)
        if: github.event_name == 'pull_request'
        run: pnpm run test test/driver/claude-code test/driver/factory
      - name: Full suite (nightly and release preparation)
        if: github.event_name != 'pull_request'
        run: pnpm run test
      - name: Build
        run: pnpm run build
      - name: Import built public entry point
        run: node --input-type=module -e "await import('./dist/index.js')"

  with-peer:
    name: build+test with the optional agent SDK peer
    runs-on: ubuntu-latest
    # The peer half runs the npm-era posture — peers auto-installed (npm 7+
    # brings peer deps along) — and it must do so UNIFORMLY: pnpm persists
    # the effective settings into every lockfile it rewrites, so the old
    # per-command --config.auto-install-peers=true on the add left the
    # checkout-local lockfile recording autoInstallPeers: true while every
    # later step resolved it as false (pnpm-workspace.yaml) and each frozen
    # install — including the verify-before-run install inside `pnpm run` —
    # aborted with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH (run 37117399190).
    # Job-level env keeps the settings fingerprint consistent across the add
    # and all later steps. Checkout-local only: the committed lockfile still
    # records the workspace posture (false).
    env:
      PNPM_CONFIG_AUTO_INSTALL_PEERS: "true"
    steps:
      - name: Check out the repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (immutable commit pin; repo policy)
        with:
          # pnpm runs repo code below, so the checkout token must not
          # survive checkout (persist-credentials: false).
          persist-credentials: false
      - name: Install ripgrep for harness search tools
        uses: ./.github/actions/install-ripgrep
      - name: Set up pnpm (version from package.json packageManager)
        # v6.1.0, immutable commit pin (repo policy)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Set up Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (immutable commit pin; repo policy)
        with:
          node-version: 24
          cache: pnpm
      # No standalone frozen install before the add: under this job's env it
      # would compare the committed lockfile's recorded autoInstallPeers
      # (false) against the job's effective true and abort — and it is
      # redundant, `pnpm add` is itself a full materializing install.
      # The pinned peer, added only in this throwaway checkout (pnpm has no
      # --no-save): the committed package.json keeps the SDK as an optional
      # peerDependency only and the committed lockfile stays peer-free —
      # this half proves the with-peer posture, not a dependency change.
      # The job env's auto-install-peers brings the SDK's own peers, as npm
      # would.
      - name: Install the optional agent SDK peer (pinned, checkout-local)
        run: pnpm add --save-optional @anthropic-ai/claude-agent-sdk@0.3.270
      - name: Assert optional peer imports
        run: node --input-type=module -e "await import('@anthropic-ai/claude-agent-sdk')"
      - name: Compiler and typed lint
        run: node scripts/ratchet-typecheck.mjs
      - name: SDK driver tests (PR)
        if: github.event_name == 'pull_request'
        run: pnpm run test test/driver/claude-code test/driver/factory
      - name: Full suite (nightly and release preparation)
        if: github.event_name != 'pull_request'
        run: pnpm run test
      - name: Build
        run: pnpm run build
      - name: Import built public entry point
        run: node --input-type=module -e "await import('./dist/index.js')"
