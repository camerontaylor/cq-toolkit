# instantiated from policy/templates/ratchet-propose.yml — edit the template, not this file
# ratchet-propose — the PRIVILEGED half of baseline-tightening proposals
# (ADR-0004 D-B "ratchet-propose"; W1.7).
#
# Carrier: `workflow_run` on `ratchet-propose-measure` for runs on main — the
# DEFAULT BRANCH's copy of this file runs (ADR-0004 D-A.1), so no pull request
# can edit what holds the automation token before promotion. The job:
#   - re-reads the triggering run from the API by numeric id and verifies its
#     workflow path, event, branch main, repository id, success, and head SHA;
#     the measured SHA must equal this trust/default-branch SHA, so stale
#     measurements cannot propose a baseline for newer code;
#   - builds the toolkit from the trust ref with `npm ci --ignore-scripts`
#     and runs NO tests and no head code (the measurement ran credential-free
#     in the measure leg);
#   - reads the measurement artifact as size-capped, schema-validated DATA;
#   - opens exactly one idempotent proposal PR **against `merge-queue`**,
#     branched from the merge-queue tip and compared against the merge-queue
#     tip's committed baselines, so the proposal goes through the queue's
#     checks like any PR (it previously targeted main and bypassed them).
#
# TOKEN DOCTRINE (scripts/ratchet-propose.mjs): the PR is authored with
# CQ_AUTOMATION_TOKEN, never GITHUB_TOKEN — a GITHUB_TOKEN-authored PR
# suppresses its own workflow runs, so its checks would never run. The
# token lives behind `environment: automation`; W1.10 moves it into that
# environment (default-branch-only policy) and replaces it with the
# automation App (ADR-0004 D-D.3). A tokenless run is a green no-op.
name: ratchet-propose

on:
  workflow_run:
    workflows:
      - ratchet-propose-measure
    types:
      - completed
    branches:
      - main

permissions: {}

concurrency:
  group: ratchet-propose
  cancel-in-progress: false

jobs:
  propose:
    name: propose
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: automation
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify the triggering measure run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          TRUST: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$RUN_ID" in ''|*[!0-9]*) echo "refusing: run id '$RUN_ID' is not numeric"; exit 1;; esac
          # The API response is authoritative; event payload fields are not.
          run="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}")"
          path="$(jq -r '.path' <<<"$run")"
          event="$(jq -r '.event' <<<"$run")"
          branch="$(jq -r '.head_branch' <<<"$run")"
          head_repo="$(jq -r '.head_repository.id' <<<"$run")"
          conclusion="$(jq -r '.conclusion' <<<"$run")"
          measured_sha="$(jq -r '.head_sha' <<<"$run")"
          [ "$path" = ".github/workflows/ratchet-propose-measure.yml" ] || { echo "refusing: run path '$path'"; exit 1; }
          [ "$event" = "push" ] || [ "$event" = "workflow_dispatch" ] || { echo "refusing: event '$event'"; exit 1; }
          [ "$branch" = "main" ] || { echo "refusing: branch '$branch'"; exit 1; }
          [ "$head_repo" = "$REPO_ID" ] || { echo "refusing: foreign run"; exit 1; }
          [ "$conclusion" = "success" ] || { echo "refusing: conclusion '$conclusion'"; exit 1; }
          [[ "$measured_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "refusing: head_sha '$measured_sha'"; exit 1; }
          [ "$measured_sha" = "$TRUST" ] || { echo "refusing: stale measurement $measured_sha (trust ref $TRUST)"; exit 1; }
          {
            echo "run_id=${RUN_ID}"
            echo "measured_sha=${measured_sha}"
          } >> "$GITHUB_OUTPUT"
      - name: Check out the trust ref (the default branch)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (immutable commit pin; repo policy)
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # The proposal push authenticates with CQ_AUTOMATION_TOKEN via
          # GIT_ASKPASS — never with this checkout's token.
          persist-credentials: false
      - name: Set up Node 24 (no cache — deciding jobs restore nothing)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (immutable commit pin; repo policy)
        with:
          node-version: 24
          cache: ''
      - name: Install and build the trusted toolkit (no lifecycle scripts)
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Download the measurement artifact (untrusted data)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (immutable commit pin; repo policy)
        with:
          name: ratchet-propose-measure
          run-id: ${{ steps.run.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ratchet-propose
      - name: Propose baseline tightening against merge-queue
        run: node scripts/ratchet-propose.mjs --measurement="${RUNNER_TEMP}/ratchet-propose/measurement.json"
        env:
          CQ_AUTOMATION_TOKEN: ${{ secrets.CQ_AUTOMATION_TOKEN }}
          RATCHET_MEASURED_SHA: ${{ steps.run.outputs.measured_sha }}
