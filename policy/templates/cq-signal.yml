# Advisory PR diagnostics for direct main development. No queue promotion carrier.
name: cq-signal

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  pull_request_review:

permissions: {}

jobs:
  signal:
    name: signal
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Wake the default-branch verifiers (this body is empty)
        # Deliberately a no-op: the verifiers read everything by head_sha.
        run: 'true'
