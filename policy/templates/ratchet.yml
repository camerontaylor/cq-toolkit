# Advisory ratchet measurements and one issue on a main PR drop.
name: ratchet

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Supersede older diagnostics for the same event and ref.
concurrency:
  group: ratchet-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# pnpm-workspace.yaml's global virtual store is a local-worktree speedup
# only: CI installs a conventional per-project node_modules, so no step
# inherits pnpm's NODE_PATH/NODE_OPTIONS resolve hook for shared stores.
env:
  PNPM_CONFIG_VIRTUAL_STORE_TYPE: project

jobs:
  ratchet:
    name: ratchet
    runs-on: ubuntu-latest
    # Runaway guard, not a speed limit: healthy runs take 15–19 min (2026-11-07 job data).
    timeout-minutes: 35
    # The `cq-state` settle ledger is machine-written; its pushes are not
    # reviewable changes (review-debt #226). Job-level, never a trigger
    # filter — I4 keeps the trigger surface intact.
    if: ${{ github.ref != 'refs/heads/cq-state' }}
    outputs:
      suite_failed: ${{ steps.suite.outcome == 'failure' }}
      drop: ${{ steps.suite.outcome == 'failure' || steps.typecheck.outcome == 'failure' || steps.coverage.outcome == 'failure' || steps.monotonic.outcome == 'failure' }}
    steps:
      - name: Check out the repo (full history — the guard needs the base diff)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (immutable commit pin; repo policy)
        with:
          fetch-depth: 0
          # pnpm runs repo code below, so the checkout token must not
          # survive checkout (persist-credentials: false).
          persist-credentials: false
      - name: Install ripgrep for harness search tools
        uses: ./.github/actions/install-ripgrep
      - name: Set up pnpm (version from package.json packageManager)
        # v6.1.0, immutable commit pin (repo policy)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Set up Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (immutable commit pin; repo policy)
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the CLI from source
        run: pnpm run build
      - name: 'Typecheck ratchet (CLI: ratchet.checkRatchet)'
        id: typecheck
        continue-on-error: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        run: |
          # The `command` source runs lane C's CheckRunner over a real tsc
          # invocation; `parse: "tsc-text"` applies the shared evidence rule
          # (a clean exit 0 over an empty capture is the authoritative zero,
          # exits 1/2 hand over the diagnostics text, anything else is
          # non-passing evidence). No expression interpolation in the script:
          # the source JSON is a literal.
          out="$(node dist/cli.js ratchet.checkRatchet \
            --ws=. \
            --target=typecheck \
            --metric=typecheck-count \
            --source='{"kind":"command","command":"node","args":["node_modules/typescript/bin/tsc","--noEmit","-p","tsconfig.json","--pretty","false"],"parse":"tsc-text"}')"
          printf '%s\n' "$out"
          printf '%s' "$out" | jq -e '.status == "ok" and .value.verdict == "pass"' >/dev/null
      - name: Run coverage suite
        id: suite
        continue-on-error: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        run: |
          # Remove stale evidence before measuring; a crashed suite cannot reuse it.
          rm -f coverage/coverage-summary.json
          pnpm exec vitest run --coverage
      - name: 'Coverage ratchet (CLI: ratchet.checkRatchet)'
        id: coverage
        if: ${{ !cancelled() && steps.suite.outcome == 'success' }}
        continue-on-error: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        run: |
          out="$(node dist/cli.js ratchet.checkRatchet \
            --ws=. \
            --target=coverage \
            --metric=coverage \
            --source='{"kind":"file","path":"coverage/coverage-summary.json","parse":"coverage-json"}')"
          printf '%s\n' "$out"
          printf '%s' "$out" | jq -e '.status == "ok" and .value.verdict == "pass"' >/dev/null
      - name: 'Baseline monotonicity guard (CLI: ratchet.monotonicGuard)'
        id: monotonic
        continue-on-error: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        env:
          # Env-indirection doctrine: expression values reach the shell as
          # env vars, never as interpolated text (an empty expression inside
          # a run block is a startup failure).
          PR_BASE: ${{ github.base_ref }}
        run: |
          # A PR may only TIGHTEN committed baselines. Ref mode: the op takes
          # the diff itself over merge-base(base, HEAD)..HEAD with the
          # hardened no-shell argv (no external diff, no textconv, no
          # renames), applies the shared one-decimal coverage re-basis, pairs
          # every deleted baseline with an added one (an unreplaced delete
          # fails), then judges baseline files alone.
          out="$(node dist/cli.js ratchet.monotonicGuard --repo=. --base="origin/${PR_BASE}" --head=HEAD)"
          printf '%s\n' "$out"
          printf '%s' "$out" | jq -e '.status == "ok" and .value.ok == true' >/dev/null

  propose-drop:
    # Fork tokens may be read-only; reporting remains advisory.
    continue-on-error: true
    needs: ratchet
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && needs.ratchet.outputs.drop == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the ratchet issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SUITE_FAILED: ${{ needs.ratchet.outputs.suite_failed }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          issue="$(gh issue list --state open --search 'ratchet in:title' --json number,title --jq '[.[] | select(.title == "ratchet")][0].number // empty')"
          if [ "$SUITE_FAILED" = "true" ]; then
            body="Ratchet test execution failed on PR #${PR_NUMBER}; coverage was not measured. Inspect the run for any additional baseline diagnostics. Evidence: ${RUN_URL}"
          else
            body="Ratchet coverage/baseline drop or measurement failure on PR #${PR_NUMBER}. Evidence: ${RUN_URL}"
          fi
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body "$body"
          else
            gh issue create --title ratchet --body "$body"
          fi
