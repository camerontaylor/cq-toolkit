# ratchet-propose-measure — the CREDENTIAL-FREE half of baseline-tightening
# proposals (ADR-0004 D-B "ratchet-propose"; W1.7).
#
# After a promotion lands on main, this leg measures the live ratchets and
# uploads a numbers-only artifact. It installs dependencies and runs the test
# suite, so it holds NO credential: `permissions: {}`, no `secrets.*`, no
# `environment:`. The proposer (`ratchet-propose.yml`, `workflow_run`, env
# `automation`) consumes the artifact as data and never shares a job with
# `npm ci` or test execution.
#
# Worst case for a forged reading: an inflated value proposes a baseline
# that is TOO TIGHT — a visible, reviewed PR through merge-queue, never a
# loosening (the monotonic guard and the verifier judge it like any PR).
#
# typecheck-count is measured with the same recompute the verifier uses
# (attribute-free extraction, trusted tsc), so a proposal and a verdict
# count the same thing.
name: ratchet-propose-measure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ratchet-propose-measure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: measure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the promoted commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (immutable commit pin; repo policy)
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (immutable commit pin; repo policy)
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies and build the CLI
        run: |
          npm ci
          npm run build
      - name: Run the suite with coverage
        run: |
          rm -f coverage/coverage-summary.json
          npx vitest run --coverage
      - name: 'Recompute typecheck-count (CLI: ratchet.recomputeTypecheck)'
        id: count
        run: |
          set -euo pipefail
          out="$(node dist/cli.js ratchet.recomputeTypecheck \
            --repo=. \
            --subject="$GITHUB_SHA" \
            --scratch="${RUNNER_TEMP}/cq-recompute")"
          printf '%s' "$out" | jq -e '.status == "ok" and (.value.count | type) == "number"' >/dev/null
          echo "typecheck_count=$(printf '%s' "$out" | jq -r '.value.count')" >> "$GITHUB_OUTPUT"
      - name: Write the numbers-only measurement
        env:
          TYPECHECK_COUNT: ${{ steps.count.outputs.typecheck_count }}
        run: |
          mkdir -p "${RUNNER_TEMP}/ratchet-propose"
          jq -e --argjson tc "$TYPECHECK_COUNT" \
            '{schemaVersion: 1, metrics: {coverage: .total.lines.pct, "typecheck-count": $tc}}
             | select(.metrics.coverage | type == "number")' \
            coverage/coverage-summary.json > "${RUNNER_TEMP}/ratchet-propose/measurement.json"
          cat "${RUNNER_TEMP}/ratchet-propose/measurement.json"
      - name: Upload the measurement artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (immutable commit pin; repo policy)
        with:
          name: ratchet-propose-measure
          path: ${{ runner.temp }}/ratchet-propose/measurement.json
          if-no-files-found: error
          retention-days: 7
