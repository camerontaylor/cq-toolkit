# Template: sync-merge-queue — keeps main and merge-queue level after
# anything lands on main. API-only triage (no checkout; cost model: zero
# clone). It NEVER writes a branch itself (W1.10 Decision 9; ADR-0004
# D-A.2/D-I):
#   - behind or diverged (main has commits merge-queue lacks): it opens, or
#     reuses, a `main → merge-queue` pull request. Ruleset R2 requires a PR
#     for every merge-queue update by a non-admin identity, so a direct ref
#     PATCH or merges-API call would be refused anyway. The sync PR is judged
#     like any PR, merged with a merge commit (I3), and admitted to main by
#     the gate's closure rule. A conflicting sync PR is visible on its own —
#     there is no separate divergence issue.
#   - ahead (merge-queue has commits main lacks): promotion is the gates'
#     job, never sync's. It dispatches BOTH merge-queue-gate.yml and gate.yml
#     on the DEFAULT ref (`ref=main`, D-A.2: a dispatch runs the dispatched
#     ref's copy of the workflow, so never merge-queue's). Each gate resolves
#     the merge-queue tip itself. During C1 both gates run; C2 retires
#     merge-queue-gate.yml and its dispatch below. Under the batch promotion
#     policy (docs/promotion-policy.md) a dispatch is only a nudge: an
#     unreviewed tip ends "awaiting promotion review" (a green run), and
#     cq-gate is report-only.
# See policy/templates/README.md for the token table and the entitlement
# facts.
#
# Credentials: reads and the gate dispatches use this job's own GITHUB_TOKEN
# (`actions: write` is for the two dispatches only — the automation App has
# no actions permission). Only the sync-PR list/create uses the automation
# credential, because a pull request opened with GITHUB_TOKEN triggers no
# workflows, so its checks would never run. The job runs in environment
# `automation` (main-only branch policy).
#
# Interim fallback (W1.10 fix round): the automation credential is REQUIRED.
# `{{INTERIM_SECRET}}` is used only while the explicit opt-in variable
# `{{INTERIM_FALLBACK}}` is non-empty — an unset automation secret alone
# never silently promotes the interim PAT into the automation identity.
#
# Instantiate (each token below is written in double braces in the body):
#   AUTOMATION_SECRET -> NAME of the secret holding the automation
#                        credential (Pull requests read/write, Contents
#                        read), e.g. CQ_AUTOMATION_TOKEN in `automation`.
#   INTERIM_SECRET    -> NAME of the secret used when AUTOMATION_SECRET is
#                        empty AND the opt-in below is set (the interim
#                        fallback until the automation credential is
#                        provisioned), e.g. PROMOTE_TOKEN.
#                        Set it to the same name as AUTOMATION_SECRET to
#                        have no fallback.
#   INTERIM_FALLBACK  -> NAME of the repo VARIABLE that arms the interim
#                        fallback when non-empty, e.g.
#                        CQ_AUTOMATION_INTERIM_FALLBACK. Unset/empty means
#                        no fallback: the sync PR then refuses with
#                        "sync not armed" until AUTOMATION_SECRET exists.
# Instantiated files reference both as `${{ secrets.<name> }}` — names,
# never values. Drop the result into .github/workflows/. Edit the template,
# not the instantiation.
name: sync-merge-queue

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Triage runs serialize so two concurrent syncs cannot race each other into
# duplicate sync PRs; a running sync is never cancelled mid-call.
concurrency:
  group: merge-queue-sync
  cancel-in-progress: false

jobs:
  sync:
    # Dispatch is an allowed carrier only on the default ref (D-A.1): a
    # dispatch on any other ref would run that ref's copy of this file.
    # Push events only ever fire this file from the default branch (the
    # trigger's branch filter), so the guard admits them regardless of the
    # ref expression.
    if: >-
      github.event_name == 'push' ||
      github.ref ==
      format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: automation
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Triage main vs merge-queue (API only, zero clone)
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATION_TOKEN: ${{ secrets.{{AUTOMATION_SECRET}} || (vars.{{INTERIM_FALLBACK}} != '' && secrets.{{INTERIM_SECRET}} || '') }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          owner="${GITHUB_REPOSITORY_OWNER}"
          compare_api="repos/${repo}/compare/main...merge-queue"
          [[ "$REPO_ID" =~ ^[0-9]+$ ]] || {
            echo "refusing: repository id '$REPO_ID'"; exit 1; }

          # gh api -i prints "HTTP/x.y CODE", headers, a blank line, then
          # the response body — for success AND error statuses alike. Read
          # the REAL status code; the callers below exit 1 on any status
          # that is not the one predicted case (a rotated credential, a
          # missing scope, a rate limit, or a 5xx must fail loudly, never
          # masquerade as success). Returning nonzero here means gh produced
          # no HTTP response at all — a loud failure too. The first argument
          # is the token the call runs under.
          API_CODE=""
          API_BODY=""
          api_as() {
            local token="$1" raw
            shift
            raw="$(GH_TOKEN="$token" gh api -i "$@")" || true
            API_CODE="$(printf '%s\n' "${raw}" | sed -n '1s|^HTTP/[0-9.]* \([0-9][0-9][0-9]\).*$|\1|p')"
            API_BODY="$(printf '%s\n' "${raw}" | sed '1,/^\r\{0,1\}$/d')"
            if [ -z "${API_CODE}" ]; then
              echo "gh api returned no HTTP response ($*) — failing loudly" >&2
              return 1
            fi
          }

          open_sync_pr() {
            if [ -z "${AUTOMATION_TOKEN}" ]; then
              echo "sync not armed: no automation credential — set the automation secret in environment automation (the interim fallback additionally needs a non-empty {{INTERIM_FALLBACK}} variable and the interim secret present)"
              exit 1
            fi
            # Reuse an open same-repo sync PR (head main, base merge-queue):
            # it already carries every main commit, since a PR's head is
            # the live branch.
            api_as "${AUTOMATION_TOKEN}" \
              "repos/${repo}/pulls?state=open&base=merge-queue&head=${owner}:main"
            [ "${API_CODE}" = 200 ] || {
              echo "unexpected HTTP ${API_CODE} listing sync PRs (expected 200) — failing loudly"
              exit 1; }
            existing="$(jq -r --argjson id "$REPO_ID" \
              '[.[] | select(.head.repo.id == $id and .head.ref == "main")]
               | .[0].html_url // empty' <<<"${API_BODY}")"
            if [ -n "${existing}" ]; then
              echo "reusing the open sync PR ${existing}"
              return 0
            fi
            api_as "${AUTOMATION_TOKEN}" -X POST "repos/${repo}/pulls" \
              -f title='sync: main → merge-queue' \
              -f head='main' \
              -f base='merge-queue' \
              -f body="sync-merge-queue opened this PR because main has commits merge-queue lacks.

          It is judged like any PR into merge-queue (the required checks, cq/policy, cq/ratchet and cq/acceptance). Merge it with a MERGE COMMIT (never squash or rebase, I3); the gate's closure rule then admits that merge commit to main. If it conflicts, resolve the conflict on a branch and merge that into merge-queue."
            case "${API_CODE}" in
              201)
                echo "opened the sync PR $(jq -r '.html_url' <<<"${API_BODY}")"
                ;;
              *)
                echo "unexpected HTTP ${API_CODE} opening the sync PR (expected 201) — failing loudly"
                exit 1
                ;;
            esac
          }

          dispatch_gate() {
            # The job's own GITHUB_TOKEN, on the default ref (D-A.2).
            api_as "${GH_TOKEN}" -X POST \
              "repos/${repo}/actions/workflows/$1/dispatches" -f ref='main'
            case "${API_CODE}" in
              204)
                echo "dispatched $1 on main"
                ;;
              *)
                echo "unexpected HTTP ${API_CODE} dispatching $1 (expected 204) — failing loudly"
                exit 1
                ;;
            esac
          }

          main_sha="$(gh api "repos/${repo}/git/ref/heads/main" --jq .object.sha)"
          queue_sha="$(gh api "repos/${repo}/git/ref/heads/merge-queue" --jq .object.sha)"
          status="$(gh api "${compare_api}" --jq .status)"
          echo "triage: status=${status} main=${main_sha} merge-queue=${queue_sha}"

          case "${status}" in
            identical)
              echo "main and merge-queue are identical — nothing to do"
              ;;
            behind|diverged)
              # main has commits merge-queue lacks: they reach the queue
              # only through a PR (R2), merged with a merge commit (I3).
              open_sync_pr
              ;;
            ahead)
              # merge-queue is ahead of main: promotion is the gates' job.
              # Their tip and merge-base guards make re-dispatch idempotent,
              # and their concurrency groups serialize it behind any
              # running promotion.
              dispatch_gate merge-queue-gate.yml
              dispatch_gate gate.yml
              ;;
            *)
              echo "unexpected compare status '${status}' — refusing to act"
              exit 1
              ;;
          esac
