# Template: merge-queue-gate — promotes checked merge-queue commits to main
# by pure fast-forward (I3). Runs on every push to merge-queue; waits until
# every required check on the gate's wait list has SUCCEEDED on the gated
# commit (never promotes unchecked, never promotes a failure), then
# ff-pushes it to main behind a merge-queue-tip guard and two merge-base guards (a skipped or missing required check is never a pass). See
# policy/templates/README.md for the token table and the entitlement facts.
#
# SUPERSEDED is not FAILED: when the gated commit is a strict ancestor of
# the CURRENT merge-queue tip (a newer queue push moved past it, which is
# also what cancels its checks), the run ends green with a "superseded by
# <tip>" summary and promotes nothing; the tip's own run decides. For the
# current tip, a failing, skipped, cancelled or missing check still
# refuses (a red run).
#
# RETIRES AT C2 (W1.10; ADR-0004 D-H.3.1): during C1 this gate runs
# ALONGSIDE cq-gate (gate.yml, the P1 promotion job); the two are the only
# components that advance main, and both promote with an atomic
# compare-and-swap push, so running both is race-safe (RS-4 T-20). It reads
# the repository-level PROMOTE_SECRET: once the owner moves that secret into
# environment `promote`, this gate fails closed and cq-gate carries every
# promotion. C2 deletes this file.
#
# Instantiate (each token below is written in double braces in the body):
#   PROMOTE_SECRET   -> NAME of the repo secret holding a PAT with
#                       contents:write. It is used for the checkout
#                       remote (so the ff-push below uses it —
#                       GITHUB_TOKEN pushes do not trigger the
#                       on:push:main sync workflow) and, as GH_TOKEN,
#                       for the check-runs API wait (GITHUB_TOKEN with
#                       contents:read also works for that wait alone).
#   GATE_CHECKS      -> the gate's wait list: comma list of required check
#                       names, e.g. static,denylist
#   GATE_TIMEOUT_MIN -> minutes to wait for the checks before refusing
#                       (default 20)
# No ${{ }} expression is ever interpolated into a run: script in this
# workflow — inputs reach scripts through env: indirection only. Drop the
# result into .github/workflows/. Edit the template, not the instantiation.
name: merge-queue-gate

on:
  push:
    branches: [merge-queue]
  workflow_dispatch:
    inputs:
      sha:
        description: merge-queue commit to gate and promote (defaults to the branch head)
        required: false
        default: ''

permissions:
  contents: read

# Promotions serialize; only the latest matters, but a running promotion is
# never cancelled mid-push.
concurrency:
  group: merge-queue-gate
  cancel-in-progress: false

jobs:
  gate:
    # Dispatch is an allowed carrier only on the default ref (D-A.1): a
    # dispatch on any other ref would run that ref's copy of this file —
    # with the promote credential one job lower. Push events only ever fire
    # this file from `merge-queue` (the trigger's branch filter), so the
    # guard admits them regardless of the ref expression.
    if: >-
      github.event_name == 'push' ||
      github.ref ==
      format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      # The gated sha reaches the script via env: indirection — never a
      # textual ${{ }} interpolation. Push events gate the pushed head
      # (GITHUB_SHA); dispatch with an explicit sha gates that sha; dispatch
      # without one resolves the merge-queue tip from the API.
      - name: Resolve the gated sha (no checkout needed)
        env:
          SHA_INPUT: ${{ inputs.sha || '' }}
          GH_TOKEN: ${{ secrets.{{PROMOTE_SECRET}} }}
        run: |
          set -euo pipefail
          if [ -n "${SHA_INPUT}" ]; then
            sha="${SHA_INPUT}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            sha="${GITHUB_SHA}"
          else
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/merge-queue" --jq .object.sha)"
          fi
          echo "gating ${sha}"
          echo "SHA=${sha}" >> "$GITHUB_ENV"
      - name: Wait for required checks on the gated sha (API only)
        id: wait
        env:
          GH_TOKEN: ${{ secrets.{{PROMOTE_SECRET}} }}
        run: |
          set -euo pipefail
          # SUPERSEDED is not FAILED: a gated sha that is a strict ancestor
          # of the CURRENT merge-queue tip can never be promoted (the tip
          # guard below), and a newer queue push is what cancels its
          # checks. Its run ends green with a "superseded by <tip>"
          # summary; the tip's own gate run decides. `superseded_by` prints
          # the tip when SHA is superseded and nothing otherwise; it runs in
          # a command substitution, so an API error prints nothing and the
          # gate falls back to refusing. For the current tip (or a sha off
          # the queue) a failing, skipped, cancelled or missing check still
          # refuses.
          superseded_by() {
            local tip state
            tip="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/merge-queue" --jq .object.sha)"
            [ -n "${tip}" ] && [ "${tip}" != "${SHA}" ] || return 0
            state="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SHA}...${tip}" --jq .status)"
            if [ "${state}" = ahead ]; then printf '%s' "${tip}"; fi
          }
          end_superseded() {
            echo "superseded: ${SHA} is no longer the merge-queue tip (superseded by $1) — not promoted; the tip's own gate run decides"
            {
              echo '## merge-queue-gate: superseded'
              echo
              echo "\`${SHA}\` is superseded by the merge-queue tip \`$1\`: not promoted; the tip's own gate run decides."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "superseded_by=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }
          # EVERY required check belongs on this wait list (README
          # "How instantiation works" step 4): a required check missing here
          # lets the gate fast-forward main while it is pending or failed.
          checks="$(echo '{{GATE_CHECKS}}' | tr -d ' ' | tr ',' ' ')"
          # Fail closed on an empty gate wait list: an empty list would run
          # the wait loop zero times and promote with NO check validated.
          if [ -z "${checks// /}" ]; then
            echo "refusing: GATE_CHECKS is empty — the gate would promote with zero checks validated"
            exit 1
          fi
          deadline=$(( $(date +%s) + {{GATE_TIMEOUT_MIN}} * 60 ))
          while :; do
            # A superseded sha has nothing left to wait for.
            by="$(superseded_by)"
            if [ -n "${by}" ]; then end_superseded "${by}"; fi
            failing=0
            waiting=0
            # filter=latest keeps one row per check name PER REPORTING
            # SUITE, not per name: a promoted sha carries same-name rows
            # from both the merge-queue-push suite and the main-push suite,
            # so a required check can appear multiple times. The verdict
            # below therefore folds EVERY matching row into ONE verdict per
            # check name (never a per-row shell read, which would see a
            # multi-line status string and spin to the timeout): waiting if
            # ANY row is incomplete, failing if ANY completed row is
            # non-success (a non-success conclusion is already terminal, so
            # it outranks waiting — fail fast instead of waiting out the
            # clock), passing only when EVERY matching row is
            # completed+success. A `skipped` conclusion is terminal and NEVER a pass: a skipped required check is missing, and missing = failing (invariant I4) — the shell below refuses it explicitly instead of waiting out the clock.
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?filter=latest" \
              --paginate \
              --jq '.check_runs[] | [.name, .status, (.conclusion // "")] | @tsv')"
            for check in ${checks}; do
              verdict="$(printf '%s\n' "${runs}" | awk -F'\t' -v c="${check}" '
                $1 == c {
                  n++
                  if ($2 != "completed") {
                    if (v != "failing" && v != "skipped") { v = "waiting"; d = $2 }
                  } else if ($3 == "skipped") {
                    if (v != "failing") { v = "skipped"; d = $3 }
                  } else if ($3 != "success") {
                    v = "failing"; d = $3
                  }
                }
                END {
                  if (n == 0) print "missing"
                  else if (v == "") print "pass"
                  else print v, d
                }
              ')"
              case "${verdict}" in
                pass)
                  ;;
                missing)
                  echo "waiting: ${check} has not reported on ${SHA} yet"
                  waiting=1
                  ;;
                waiting\ *)
                  echo "waiting: ${check} is ${verdict#waiting } on ${SHA}"
                  waiting=1
                  ;;
                skipped\ *)
                  echo "refusing: ${check} concluded skipped on ${SHA} — a skipped required check is neither pass nor fail (missing = failing, I4)"
                  failing=1
                  ;;
                failing\ *)
                  echo "refusing: ${check} completed with conclusion ${verdict#failing } on ${SHA}"
                  failing=1
                  ;;
              esac
            done
            if [ "${failing}" -ne 0 ]; then
              # Re-read the tip AFTER the checks: the push that cancelled a
              # check has already moved it. Only a superseded sha is spared.
              by="$(superseded_by)"
              if [ -n "${by}" ]; then end_superseded "${by}"; fi
              exit 1
            fi
            if [ "${waiting}" -eq 0 ]; then
              echo "all required checks succeeded on ${SHA}"
              exit 0
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              by="$(superseded_by)"
              if [ -n "${by}" ]; then end_superseded "${by}"; fi
              echo "refusing: timed out after {{GATE_TIMEOUT_MIN}} minutes waiting for required checks on ${SHA} — never promote unchecked"
              exit 1
            fi
            sleep 30
          done
      # The wait above is API-only and may refuse, time out or end
      # superseded — none of those runs may pay for a clone at all. Full
      # history is needed only by the guards and the push below; the token
      # input re-keys the origin remote to the promote PAT so the ff-push
      # authenticates with it.
      # Pinned to an immutable commit SHA; persist-credentials deliberately
      # stays ON here: this job pushes with the promote PAT and runs no repo
      # code that could exfiltrate it.
      - name: Check out the merge-queue head (full history, promote-token remote)
        if: steps.wait.outputs.superseded_by == ''
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (immutable commit pin; repo policy)
        with:
          ref: merge-queue
          fetch-depth: 0
          token: ${{ secrets.{{PROMOTE_SECRET}} }}
      - name: Validate the gated sha
        if: steps.wait.outputs.superseded_by == ''
        run: |
          set -euo pipefail
          # SHA is SHA_INPUT verbatim when dispatch supplied one — verify it
          # names a real commit in the fetched history before any use.
          git rev-parse --verify "${SHA}^{commit}"
      - name: Fast-forward promote the gated sha to main (guarded)
        if: steps.wait.outputs.superseded_by == ''
        run: |
          set -euo pipefail
          git fetch origin main merge-queue
          if git merge-base --is-ancestor "${SHA}" origin/main; then
            echo "no-op: ${SHA} is already an ancestor of main (already promoted)"
            exit 0
          fi
          # Tip guard: the gate promotes ONLY the current merge-queue tip.
          # A manual dispatch (or a race with a newer queue push) must never
          # promote an off-queue or stale commit. A queue commit the tip has
          # moved past is SUPERSEDED: not promoted, the run stays green and
          # the tip's own gate run decides. A sha off the queue refuses.
          queue_tip="$(git rev-parse origin/merge-queue)"
          if [ "${SHA}" != "${queue_tip}" ]; then
            if git merge-base --is-ancestor "${SHA}" "${queue_tip}"; then
              echo "superseded: ${SHA} is not the current merge-queue tip (superseded by ${queue_tip}) — not promoted; the tip's own gate run decides"
              echo "## merge-queue-gate: superseded by \`${queue_tip}\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "refusing: ${SHA} is not the current merge-queue tip (${queue_tip}) — promotion advances main to the tip only"
            exit 1
          fi
          if ! git merge-base --is-ancestor origin/main "${SHA}"; then
            echo "refusing: main has diverged from merge-queue (origin/main is not an ancestor of ${SHA}) — merge main into merge-queue and let the gate re-run"
            exit 1
          fi
          # Atomic compare-and-swap: the second refspec updates merge-queue
          # to the gated SHA — an up-to-date no-op in the normal case — so a
          # CONCURRENT queue advance turns it into a rewind the server
          # rejects, and --atomic rejects the whole push: main only ever
          # advances to a commit that is still the queue tip at push time.
          # (A value-changing second refspec is impossible on success: that
          # direction is a rewind, which is exactly the rejection.)
          if ! git push --atomic origin "${SHA}:refs/heads/main" "${SHA}:refs/heads/merge-queue"; then
            # A rejected CAS whose cause is a newer queue push is the same
            # supersession, raced; any other rejection refuses.
            git fetch origin merge-queue
            queue_tip="$(git rev-parse origin/merge-queue)"
            if [ "${SHA}" != "${queue_tip}" ] &&
              git merge-base --is-ancestor "${SHA}" "${queue_tip}"; then
              echo "superseded: the queue advanced to ${queue_tip} during the push — not promoted; the tip's own gate run decides"
              echo "## merge-queue-gate: superseded by \`${queue_tip}\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "refusing: the atomic push of ${SHA} was rejected"
            exit 1
          fi
          echo "promoted ${SHA} to main by pure fast-forward (atomic tip CAS)"
