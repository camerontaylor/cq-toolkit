# Legacy pattern corpus for the pre-upload review scanners: src/ops/dev/
# denylist.ts (dev.review) and apps/crq-python/crq.py (crq, which reads this
# file from the default branch at run time and refuses to run if a class id it
# expects is missing). CI no longer reads it: the denylist workflow, pack-audit
# and dev.check scan with .gitleaks.toml. Both scanners move to .gitleaks.toml
# next, and this file is deleted after crq is redeployed.
#
# Matching is case-sensitive; bare names are word-bounded. The samples are
# intentionally dirty, so .gitleaks.toml allowlists this file.
#
# Constrained format (read by hand-written parsers): top-level keys `rules`
# and `clean_probes`; rule keys `id`, `description`, `regex`, `sample`,
# optional `path` and `probe_path`; values single-quoted or plain scalars.

rules:
  - id: class:webfront-hostnames
    description: legacy internal hostnames (fleet host names are not secret)
    regex: '\b[a-z0-9-]+\.webfront\.app\b'
    sample: 'redeploy ceres and pluto.webfront.app tonight'
  - id: class:client-names
    description: client names
    regex: '\b(beedee|greenbooks|dahlsens|phoenix|flagstaff|map72|extrava|neutron)\b|\bmetal\.one\b'
    sample: 'dashboard for beedee (metal.one brand family)'
  - id: class:personal-paths
    description: personal machine paths and bundle ids
    regex: '/home/ctaylor\b|/home/app/webfront\b|\.pnpm-store\b|com\.webfront\.reap\b'
    sample: 'cwd=/home/ctaylor store=$HOME/repos/.pnpm-store'
  - id: class:portkey-config
    description: portkey instance config (publish class; vocabulary, not value)
    regex: '\bportkey\b'
    sample: 'portkey route tables for the gateway'
  - id: class:route-key-material
    description: gateway route key material (universal; the value shape itself)
    regex: '\bpk-[A-Za-z0-9_-]{16,}'
    sample: 'route key pk-abcdefghijklmno-'
  - id: class:agent-memory
    description: agent memory corpus paths
    regex: '\.om[cx]\b'
    sample: 'sync .omc/memory daily; skip .omx'
  - id: class:token-ssh-plumbing
    description: key material and token plumbing (SSH filenames alone are not key material)
    regex: '-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----|\bssh-(rsa|ed25519|ecdsa|dsa) AAAA[A-Za-z0-9+/]{32,}|\bGH_FOR_FA\b'
    sample: 'key: -----BEGIN OPENSSH PRIVATE KEY-----'
  - id: class:webfront-package-names
    description: webfront package scope and vp CLI invocations
    regex: '\bvp\s+(test|run|build|dev|exec|watch|preview)\b|@webfront/'
    sample: 'vp test --changed origin/main'
  - id: class:key-material-env
    description: any content in a *.env* path is treated as key material
    regex: '.+'
    path: '(^|/)[^/]*\.env'
    sample: 'API_KEY=sk-1234567890abcdef'
  - id: class:inline-secret-assignments
    description: unquoted inline secret-valued assignments, any name case (universal; refs/quotes/URL schemes/call values excluded; any bare 12+ char token counts, like the overbroad .env path class)
    regex: '\b[A-Za-z0-9_]*([Tt][Oo][Kk][Ee][Nn]|[Ss][Ee][Cc][Rr][Ee][Tt]|[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]|[Pp][Aa][Ss][Ss][Pp][Hh][Rr][Aa][Ss][Ee]|[Aa][Pp][Ii]_[Kk][Ee][Yy]|[Aa][Pp][Ii][Kk][Ee][Yy])[A-Za-z0-9_]*=[^\s{$"''(/:][^\s("'':]{11,}(?:[\s/]|$)'
    sample: 'export GITHUB_TOKEN=ghp_0123456789abcdef'
  - id: class:agent-scratch-paths
    description: agent scratch dirs committed into the tree (runtime tooling state, never content)
    regex: '.+'
    path: '(^|/)\.(zcode|paseo)(/|$)|\.claude/(settings\.local\.json|\.credentials\.json|scheduled_tasks\.lock|memory\.db(-wal|-shm)?|worktrees|shell-snapshots|history\.jsonl|paste-cache|file-history|session-env)(/|$)'
    sample: 'agent scratch state'
    probe_path: '.zcode/probe.txt'
clean_probes:
  - 'phoenixes rise over plutocracy: extravagant mappings for the masses'
  - 'VP of Engineering and the vp of operations both approved'
  - 'astronomy notes: Ceres and Pluto are dwarf planets; neutrons spin'
  - 'see the *.env* handling docs before rotating any key'
  - 'map the strategy; flag the staff rota; extra values everywhere'
